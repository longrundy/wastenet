<!-- ONE copy of the explanations, shared by all three pages. Not inlined -
     an inlined copy is a copy, and copies drift. This is the whole point. -->
<script src="logic.js?v=2026-07-15-menu"></script>

<script>
/* ============================================================
   WasteNet - receivables and payments, read only.

   Two sections, two different jobs:
     Receivables  - who owes us (open invoices, by aging bucket)
     Payments     - what actually came in, by month

   Reads the `receivables` action, which returns ONLY the open
   invoices plus the counts the scorecard needs. The Invoices tab
   holds ~6,000 rows; shipping all of them to render ~140 was why
   this page used to load slowly.
   ============================================================ */

var API = "https://script.google.com/macros/s/AKfycbwvvAfVChkEJPlgz8c0iRbH23YIrtxM7SGjm5YgNz-kgs43N7hCGtd8nqBewJJOt8mV/exec";

/* The read-only access code, deliberately hardcoded.
   The full dashboard key is NOT here and must never be. This one is checked
   server-side against READ_KEY and is accepted for exactly three actions -
   receivables, collections, invoice. Asking it for billing, agents,
   financials or deposits gets the same refusal as no key at all, so a copy
   of this file buys nobody anything the page was not already showing. */
var KEY = "wn-ro-4tqm9vhx2ks7";

var state = {
  section: "receivables",
  invoices: [],      // open only
  paidCount: 0,
  totalCount: 0,
  loaded: false,
  age: "current",
  search: "",
  sortKey: "age",
  sortDir: "desc",
  rcSel: "",         // receivables: which invoice is showing in the green pane

  // payments
  months: [],          // [{month,total,count}] newest first
  month: "",           // selected yyyy-mm
  payments: [],        // rows for the selected month
  ytd: 0,
  colLoaded: false,
  colLoading: false,
  colSearch: "",
  colSortKey: "date",
  colSortDir: "desc",
  pmSel: "",           // payments: which invoice is showing in the green pane
  year: "",            // which year is loaded
  years: [],           // [{year,total}] newest first
  payByYear: {}        // year -> payment rows, so month switching is free
};

/* ---------- JSONP ---------- */
function jsonp(params, cb){
  var name = "wn_cb_" + Math.random().toString(36).slice(2);
  var s;
  var timeout = setTimeout(function(){
    cleanup();
    cb({ ok:false, error:"Request timed out. Check your connection." });
  }, 30000);
  function cleanup(){
    clearTimeout(timeout);
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(s && s.parentNode) s.parentNode.removeChild(s);
  }
  window[name] = function(data){
    cleanup();
    /* There is no lock screen to fall back to. If the read-only key stops
       being accepted the backend has changed, and saying so plainly beats
       an empty page. */
    if(data && data.authRequired){
      showError("This page's read-only access was refused by the server. " +
                "The backend key may have changed \u2014 tell Lon.");
      return;
    }
    cb(data);
  };
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+"="+encodeURIComponent(params[k]);
  }).join("&");
  s = document.createElement("script");
  s.src = API + "?" + qs + "&callback=" + name;
  s.onerror = function(){ cleanup(); cb({ ok:false, error:"Could not reach the server." }); };
  document.body.appendChild(s);
}

/* ---------- helpers ---------- */
function money(n){
  n = Number(n) || 0;
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function moneyShort(n){
  n = Number(n) || 0;
  return "$" + Math.round(n).toLocaleString("en-US");
}
/* Dates on this page read MM/DD/YYYY. The sheet stores yyyy-MM-dd because
   that sorts correctly as text; humans read the other one. */
function usDate(s){
  s = String(s || "");
  if(s.length < 10) return s;
  var y = s.slice(0,4), m = s.slice(5,7), d = s.slice(8,10);
  if(!/^\d{4}$/.test(y)) return s;
  return m + "/" + d + "/" + y;
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* Clicking an invoice number opens the invoice HERE, not in QuickBooks.
 *
 * The obvious thing was to link to qbo.intuit.com - but not everyone who
 * needs to read an invoice has a QuickBooks login, and that link sends them
 * to a sign-in page they can't get past. Worse than no link.
 *
 * So we render it ourselves from the stored lines. Which is better anyway:
 * we can show WHICH line was excluded from a payout, and why. That is the
 * question someone would actually be asking. */
function invLink(doc, qboId, cls){
  if(!doc) return "";
  var text = esc(doc);
  return '<a class="ilink' + (cls ? " " + cls : "") + '" href="#" ' +
         'data-invoice="' + text + '" ' +
         'title="View invoice ' + text + '">' + text + '</a>';
}

/* ---------- invoice panel ---------- */
var ivCache = {};

function openInvoice(doc){
  var bg = document.getElementById("ivbg");
  document.getElementById("ivtitle").textContent = "Invoice " + doc;
  document.getElementById("ivsub").textContent = "";
  document.getElementById("ivbody").innerHTML =
    '<div class="empty-state"><span class="spinner"></span>Loading invoice&hellip;</div>';
  bg.classList.add("show");

  if(ivCache[doc]){ paintInvoice(ivCache[doc]); return; }

  jsonp({ action:"invoice", key:KEY, doc:doc }, function(data){
    if(!data || !data.ok){
      document.getElementById("ivbody").innerHTML =
        '<div class="empty-state">' + esc((data && data.error) || "Could not load that invoice.") + '</div>';
      return;
    }
    ivCache[doc] = data;
    paintInvoice(data);
  });
}

function buildInvoiceBody(d){
  var h = d.invoice || {};
  var lines = d.lines || [];

  var stats = '<div class="ivsum">' +
    '<div class="ivstat"><div class="ivstat-n">$' + fmt(h.total) + '</div>' +
      '<div class="ivstat-l">invoice total</div></div>' +
    '<div class="ivstat"><div class="ivstat-n">' + fmtN(h.boxes) + '</div>' +
      '<div class="ivstat-l">boxes</div></div>' +
    '<div class="ivstat"><div class="ivstat-n" style="color:var(--green-dark)">$' + fmt(h.monitoring) + '</div>' +
      '<div class="ivstat-l">monitoring</div></div>' +
    (h.charges
      ? '<div class="ivstat"><div class="ivstat-n" style="color:var(--red-dark)">$' + fmt(h.charges) + '</div>' +
        '<div class="ivstat-l">one-time fees</div></div>'
      : '') +
  '</div>';

  /* A bundle header is dropped, not dimmed. Showing "trash compactors, 2 x $150
     = $300" above the two $150 lines that ARE those compactors invites exactly
     the reading it got: three charges on a $300 invoice, summing to $600. The
     components name the actual boxes; the header names nothing. */
  var rows = lines.filter(function(l){ return !l.bundle; }).map(function(l){
    var cls = l.kind === 'CHARGE' ? ' class="charge"'
            : l.kind === 'HEADER' ? ' class="header-line"' : '';
    var kind = l.kind === 'CHARGE' ? '<span class="ivkind k-charge">one-time</span>'
             : l.kind === 'HEADER' ? '<span class="ivkind k-header">heading</span>'
             : '<span class="ivkind k-box">box</span>';
    return '<tr' + cls + '>' +
      '<td style="width:46%">' + esc(l.desc) +
        (l.why ? '<div class="ivwhy">excluded \u2014 ' + esc(l.why) + '</div>' : '') + '</td>' +
      '<td class="num" style="width:8%">' + (l.qty == null ? '\u2014' : fmtN(l.qty)) + '</td>' +
      '<td class="num iv-rate" style="width:13%">' + (l.rate == null ? '\u2014' : '$' + fmt(l.rate)) + '</td>' +
      '<td class="num" style="width:14%">$' + fmt(l.amount) + '</td>' +
      '<td style="width:19%">' + kind + '</td>' +
    '</tr>';
  }).join("");

  var table = '<table class="ivtable"><thead><tr>' +
      '<th>Description</th><th class="num">Qty</th><th class="num iv-rate">Rate</th>' +
      '<th class="num">Amount</th><th>Counted as</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

  var paid = "";
  if(d.payments && d.payments.length){
    var tot = d.payments.reduce(function(s,p){ return s + p.amount; }, 0);
    paid = '<div class="ivpaid"><b>Paid:</b> ' +
      d.payments.map(function(p){
        return '$' + fmt(p.amount) + ' on ' + esc(usDate(p.date));
      }).join(' \u00b7 ') +
      (d.payments.length > 1 ? ' &nbsp;\u2014 total $' + fmt(tot) : '') +
      '</div>';
  } else {
    paid = '<div class="ivpaid" style="background:var(--panel); border-color:var(--line); color:var(--ink-2);">' +
           'No payment recorded against this invoice yet.</div>';
  }

  var note = h.charges
    ? '<div class="ivnote">Rows shaded red are one-time fees \u2014 a new box, a ' +
      'replacement, a lost monitor. They are excluded from the box count and earn ' +
      'no commission. Everything else is a monitored box.</div>'
    : '';

  return stats + table + paid + note;
}

function paintInvoice(d){
  var h = d.invoice || {};
  document.getElementById("ivtitle").textContent =
    "Invoice " + (h.docNumber || "") + " \u00b7 " + (h.customer || "");
  document.getElementById("ivsub").textContent =
    (h.txnDate ? "Dated " + usDate(h.txnDate) : "") +
    (h.dueDate ? " \u00b7 due " + usDate(h.dueDate) : "") +
    (h.status ? " \u00b7 " + h.status : "");
  document.getElementById("ivbody").innerHTML = buildInvoiceBody(d);
}

(function(){
  var bg = document.getElementById("ivbg");

  // Any invoice number, anywhere on the page, opens the panel.
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest("[data-invoice]");
    if(a){
      e.preventDefault();
      openInvoice(a.getAttribute("data-invoice"));
      return;
    }
    if(e.target === bg) bg.classList.remove("show");
  });

  document.getElementById("ivclose").onclick = function(){ bg.classList.remove("show"); };
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") bg.classList.remove("show");
  });
})();

/* Days past due. Zero or negative = not yet due. */
function daysOverdue(inv){
  if(!inv.dueDate) return 0;
  var due = new Date(inv.dueDate + "T00:00:00");
  if(isNaN(due.getTime())) return 0;
  var t = new Date();
  t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.floor((t - due) / 86400000);
}

function bucketOf(inv){
  var d = daysOverdue(inv);
  if(d <= 0)  return "current";
  if(d <= 30) return "b30";
  if(d <= 60) return "b60";
  if(d <= 90) return "b90";
  return "b90p";
}

var BUCKETS = [
  { key:"current", label:"Current",         chip:"chip-cur"  },
  { key:"b30",     label:"1\u201330 days",  chip:"chip-30"   },
  { key:"b60",     label:"31\u201360 days", chip:"chip-60"   },
  { key:"b90",     label:"61\u201390 days", chip:"chip-90"   },
  { key:"b90p",    label:"90+ days",        chip:"chip-90p"  }
];

function chipFor(inv){
  var d = daysOverdue(inv);
  var meta = BUCKETS.filter(function(x){ return x.key === bucketOf(inv); })[0];
  return '<span class="chip ' + meta.chip + '">' + (d <= 0 ? "Current" : d + "d") + '</span>';
}

/* ---------- scorecard ---------- */
function cell(n, label, cls){
  return '<div class="score-cell">' +
           '<div class="score-n ' + (cls || "n-ink") + '">' + n + '</div>' +
           '<div class="score-l">' + label + '</div>' +
         '</div>';
}

var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function monthLabel(m){
  if(!m || m.length < 7) return m || "";
  var mi = parseInt(m.slice(5,7), 10) - 1;
  return (MONTH_NAMES[mi] || "?") + " " + m.slice(0,4);
}

/* Tabs show the month alone - the year is right there in the dropdown,
   and dropping it lets all twelve sit on one row. */
function monthShort(m){
  if(!m || m.length < 7) return m || "";
  return MONTH_NAMES[parseInt(m.slice(5,7), 10) - 1] || "?";
}

function renderSummary(){
  var el = document.getElementById("summary");

  if(state.section === "payments"){
    if(!state.colLoaded){ el.innerHTML = ""; return; }

    var prev = state.months[1];
    var sel  = state.months.filter(function(m){ return m.month === state.month; })[0];

    el.innerHTML = '<div class="score">' +
      cell(moneyShort(sel ? sel.total : 0), monthLabel(state.month) + " collected", "n-ink") +
      cell(moneyShort(prev ? prev.total : 0), monthLabel(prev ? prev.month : ""), "n-ink") +
      cell(moneyShort(state.ytd), "year to date", "n-green") +
      cell(sel ? sel.count : 0, "payments", "n-ink") +
    '</div>';
    return;
  }

  var open = state.invoices;
  var outstanding = open.reduce(function(s,i){ return s + (Number(i.balance)||0); }, 0);
  var pastDueAmt = open.filter(function(i){ return daysOverdue(i) > 0; })
                       .reduce(function(s,i){ return s + (Number(i.balance)||0); }, 0);

  el.innerHTML = '<div class="score">' +
    cell(moneyShort(outstanding), "outstanding", "n-ink") +
    cell(moneyShort(pastDueAmt),  "past due",    "n-red") +
    cell(open.length,             "open",        "n-ink") +
    cell(state.paidCount.toLocaleString("en-US"), "paid", "n-green") +
  '</div>';
}

/* ---------- receivables ---------- */
function renderReceivables(){
  var open = state.invoices;

  /* Five aging folders across the top of the gray column, above the column
     header. No counts on them - the summary line in the fixed header reports
     the count and dollar total for whichever tab is open. */
  var tabs = '<div class="folder-tabs">' + BUCKETS.map(function(b){
    return '<button class="ftab' + (state.age === b.key ? " sel" : "") + '" data-age="' + b.key + '">' +
             b.label + '</button>';
  }).join("") + '</div>';

  var rows = open.filter(function(i){ return bucketOf(i) === state.age; });

  if(state.search){
    var q = state.search.toLowerCase();
    rows = rows.filter(function(i){
      return String(i.customer).toLowerCase().indexOf(q) !== -1 ||
             String(i.docNumber).toLowerCase().indexOf(q) !== -1;
    });
  }

  var dir = state.sortDir === "asc" ? 1 : -1;
  rows.sort(function(a,b){
    var av, bv;
    switch(state.sortKey){
      case "inv":     av = String(a.docNumber); bv = String(b.docNumber); break;
      case "cust":    av = String(a.customer).toLowerCase(); bv = String(b.customer).toLowerCase(); break;
      case "due":     av = String(a.dueDate); bv = String(b.dueDate); break;
      case "balance": av = Number(a.balance)||0; bv = Number(b.balance)||0; break;
      default:        av = daysOverdue(a); bv = daysOverdue(b);
    }
    if(av < bv) return -1 * dir;
    if(av > bv) return  1 * dir;
    return 0;
  });

  /* Land on the top invoice of the open bucket. If the selected invoice is no
     longer in this bucket (switched tab) or was filtered out by a search, fall
     to whatever now sits on top - the same "land on the first row" rule Agents
     uses for John Lydick. */
  var docs = rows.map(function(i){ return String(i.docNumber); });
  if(!state.rcSel || docs.indexOf(String(state.rcSel)) === -1){
    state.rcSel = rows.length ? String(rows[0].docNumber) : "";
  }

  var caret = function(k){
    if(state.sortKey !== k) return "";
    return ' <span class="sc">' + (state.sortDir === "asc" ? "\u25B2" : "\u25BC") + '</span>';
  };

  var head =
    '<div class="rc-head">' +
      '<span class="rc-inv"  data-rsort="inv">Invoice'   + caret("inv")     + '</span>' +
      '<span class="rc-cust" data-rsort="cust">Customer' + caret("cust")    + '</span>' +
      '<span class="rc-due"  data-rsort="due">Due'       + caret("due")     + '</span>' +
      '<span class="rc-bal"  data-rsort="balance">Balance' + caret("balance") + '</span>' +
      '<span class="rc-age"  data-rsort="age">Age'       + caret("age")     + '</span>' +
    '</div>';

  var body;
  if(!rows.length){
    body = head + '<div class="empty-state">' +
      (state.search ? "No invoice matches that." : "Nothing in this bucket.") + '</div>';
  } else {
    body = head + rows.map(function(i){
      var sel = String(i.docNumber) === String(state.rcSel);
      return '<div class="agrow' + (sel ? " open" : "") + '" data-rcrow="' + esc(i.docNumber) + '">' +
        '<div class="aghead">' +
          '<span class="rc-inv">' + esc(i.docNumber) + '</span>' +
          '<span class="rc-cust" title="' + esc(i.customer) + '">' + esc(i.customer) + '</span>' +
          '<span class="rc-due">' + (i.dueDate ? esc(shortDate(i.dueDate)) : "\u2014") + '</span>' +
          '<span class="rc-bal">' + money(i.balance) + '</span>' +
          '<span class="rc-age">' + chipFor(i) + '</span>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  var owed = rows.reduce(function(s,i){ return s + (Number(i.balance)||0); }, 0);
  var cur  = BUCKETS.filter(function(b){ return b.key === state.age; })[0];
  var noteLine = cur.label + ' \u00b7 ' + rows.length + ' invoice' + (rows.length === 1 ? "" : "s") +
                 ' \u00b7 ' + moneyShort(owed);

  var green;
  if(state.rcSel && ivCache[state.rcSel]){
    green = rcPaneHtml(ivCache[state.rcSel]);
  } else if(state.rcSel){
    green = '<div class="empty-state"><span class="spinner"></span>Loading invoice\u2026</div>';
  } else {
    green = '<div class="ag-pane-empty">Select an invoice on the left to view it here.</div>';
  }

  return '<div class="folder rc-folder">' +
      '<div class="ag-topbar">' +
        '<div class="ag-hd ag-hd-list">' +
          '<div class="ag-hd-drow"><div class="ag-hd-title">Receivables</div>' +
            '<input class="search bsearch-hd" id="search" type="text" placeholder="Search customer or #" value="' + esc(state.search) + '"></div>' +
          '<div class="ag-hd-note">' + noteLine + '</div>' +
        '</div>' +
        '<div class="ag-hd ag-hd-detail"><div class="ag-hd-title">Invoice View</div></div>' +
      '</div>' +
      '<div class="ag-split"><div class="ag-list-col">' +
        '<div class="pinhead" id="pinhead">' + tabs + '</div>' +
        '<div class="folder-lower">' + body + '</div>' +
      '</div>' +
      '<aside class="ag-detail" id="rcPane">' + green + '</aside></div>' +
    '</div>';
}

/* Short date for the tight gray column - two-digit year, so 07/25/2026 reads
   07/25/26 and Due never crowds Balance. */
function shortDate(s){
  s = String(s || "");
  if(s.length < 10) return s;
  if(!/^\d{4}$/.test(s.slice(0,4))) return s;
  return s.slice(5,7) + "/" + s.slice(8,10) + "/" + s.slice(2,4);
}

/* The invoice detail, painted into the green pane instead of a pop-up. Same
   renderer the modal uses (buildInvoiceBody), with a heading naming it above. */
function rcPaneHtml(d){
  var h = d.invoice || {};
  var sub = (h.txnDate ? "Dated " + usDate(h.txnDate) : "") +
            (h.dueDate ? " \u00b7 due " + usDate(h.dueDate) : "") +
            (h.status  ? " \u00b7 " + esc(h.status) : "");
  return '<div class="rc-iv-card">' +
      '<div class="rc-iv-head">' +
        '<div class="rc-iv-title">Invoice ' + esc(h.docNumber || "") +
          (h.customer ? ' \u00b7 ' + esc(h.customer) : "") + '</div>' +
        (sub ? '<div class="rc-iv-sub">' + sub + '</div>' : "") +
      '</div>' + buildInvoiceBody(d) +
    '</div>';
}

function loadRcInvoice(doc){
  var pane = document.getElementById("rcPane");
  if(!pane || !doc) return;
  if(ivCache[doc]){ pane.innerHTML = rcPaneHtml(ivCache[doc]); return; }
  pane.innerHTML = '<div class="empty-state"><span class="spinner"></span>Loading invoice\u2026</div>';
  jsonp({ action:"invoice", key:KEY, doc:doc }, function(data){
    if(String(state.rcSel) !== String(doc)) return;   // a newer row was clicked
    var p = document.getElementById("rcPane");
    if(!p) return;
    if(!data || !data.ok){
      p.innerHTML = '<div class="ag-pane-empty">' +
        esc((data && data.error) || "Could not load that invoice.") + '</div>';
      return;
    }
    ivCache[doc] = data;
    p.innerHTML = rcPaneHtml(data);
  });
}

/* fmt / fmtN live here rather than with the other helpers only because the
   invoice card and the scorecard both reached for them where they used to
   sit, inside the agents block. Same two functions, nothing changed. */
function fmt(n){
  return (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtN(n){
  n = Number(n) || 0;
  return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
}

/* ---------- payments ---------- */
/* ---------- payments ---------- */
function renderCollections(){
  if(!state.colLoaded){
    return '<div class="empty-state"><span class="spinner"></span>Loading payments\u2026</div>';
  }
  if(!state.months.length){
    return '<div class="empty-state">No payments found.</div>';
  }

  /* months in the loaded year, newest first */
  var shown = state.months.filter(function(m){ return m.month.slice(0,4) === state.year; });

  /* Each option carries what that year collected, so the totals are visible
     in the list itself. Sits in the tabs row, left of the months - same as
     the year dropdown on Billing. */
  var yrOpts = state.years.map(function(y){
    return '<option value="' + y.year + '"' + (state.year === y.year ? " selected" : "") + '>' +
             y.year + '  \u00b7  ' + moneyShort(y.total) + '</option>';
  }).join("");

  var tabs = '<div class="folder-tabs">' +
    '<select class="ftab-yr" id="yrSel" aria-label="Year">' + yrOpts + '</select>' +
    shown.map(function(m){
      return '<button class="ftab' + (state.month === m.month ? " sel" : "") + '" ' +
             'data-month="' + m.month + '">' + monthShort(m.month) + '</button>';
    }).join("") + '</div>';

  /* Payments for the loaded year are already here - slice by month with no
     round trip. */
  var rows = (state.payByYear[state.year] || []).filter(function(p){
    return String(p.txnDate).slice(0,7) === state.month;
  });

  if(state.colSearch){
    var q = state.colSearch.toLowerCase();
    rows = rows.filter(function(p){
      return String(p.customer).toLowerCase().indexOf(q) !== -1 ||
             String(p.docNumber).toLowerCase().indexOf(q) !== -1;
    });
  }

  var dir = state.colSortDir === "asc" ? 1 : -1;
  rows.sort(function(a,b){
    var av, bv;
    switch(state.colSortKey){
      case "cust":   av = String(a.customer).toLowerCase(); bv = String(b.customer).toLowerCase(); break;
      case "inv":    av = String(a.docNumber); bv = String(b.docNumber); break;
      case "amount": av = Number(a.amount)||0; bv = Number(b.amount)||0; break;
      default:       av = String(a.txnDate); bv = String(b.txnDate);
    }
    if(av < bv) return -1 * dir;
    if(av > bv) return  1 * dir;
    return 0;
  });

  /* Land on the first payment that is tied to an invoice - a credit or an
     unapplied prepayment has no invoice to show on the right. */
  var docd = rows.filter(function(p){ return p.docNumber; }).map(function(p){ return String(p.docNumber); });
  if(!state.pmSel || docd.indexOf(String(state.pmSel)) === -1){
    state.pmSel = docd.length ? docd[0] : "";
  }

  var caret = function(k){
    if(state.colSortKey !== k) return "";
    return ' <span class="sc">' + (state.colSortDir === "asc" ? "\u25B2" : "\u25BC") + '</span>';
  };

  var head =
    '<div class="rc-head">' +
      '<span class="pm-date" data-pmsort="date">Date'     + caret("date")   + '</span>' +
      '<span class="pm-cust" data-pmsort="cust">Customer' + caret("cust")   + '</span>' +
      '<span class="pm-inv"  data-pmsort="inv">Invoice'   + caret("inv")    + '</span>' +
      '<span class="pm-amt"  data-pmsort="amount">Amount' + caret("amount") + '</span>' +
    '</div>';

  var body;
  if(!rows.length){
    body = head + '<div class="empty-state">' +
      (state.colSearch ? "No payment matches that." : "No payments in this month.") + '</div>';
  } else {
    body = head + rows.map(function(p){
      var cells =
        '<span class="pm-date">' + esc(usDate(p.txnDate)) + '</span>' +
        '<span class="pm-cust" title="' + esc(p.customer) + '">' + esc(p.customer) + '</span>';
      if(p.docNumber){
        var sel = String(p.docNumber) === String(state.pmSel);
        return '<div class="agrow' + (sel ? " open" : "") + '" data-pmrow="' + esc(p.docNumber) + '">' +
          '<div class="aghead">' + cells +
            '<span class="pm-inv">' + esc(p.docNumber) + '</span>' +
            '<span class="pm-amt">' + money(p.amount) + '</span>' +
          '</div>' +
        '</div>';
      }
      /* Credit / prepayment - no invoice, so the row is not selectable. */
      return '<div class="agrow pm-unapplied">' +
          '<div class="aghead">' + cells +
            '<span class="pm-inv"><span class="chip chip-30">unapplied</span></span>' +
            '<span class="pm-amt">' + money(p.amount) + '</span>' +
          '</div>' +
        '</div>';
    }).join("");
  }

  var total = rows.reduce(function(s,p){ return s + (Number(p.amount)||0); }, 0);
  var noteLine = monthLabel(state.month) + ' \u00b7 ' + rows.length +
    ' payment' + (rows.length === 1 ? "" : "s") + ' \u00b7 ' + moneyShort(total);

  var green;
  if(state.pmSel && ivCache[state.pmSel]){
    green = rcPaneHtml(ivCache[state.pmSel]);
  } else if(state.pmSel){
    green = '<div class="empty-state"><span class="spinner"></span>Loading invoice\u2026</div>';
  } else {
    green = '<div class="ag-pane-empty">Select a payment on the left to view its invoice here.</div>';
  }

  return '<div class="folder rc-folder pm-folder">' +
      '<div class="ag-topbar">' +
        '<div class="ag-hd ag-hd-list">' +
          '<div class="ag-hd-drow"><div class="ag-hd-title">Payments</div>' +
            '<input class="search bsearch-hd" id="colSearch" type="text" placeholder="Search customer or #" value="' + esc(state.colSearch) + '"></div>' +
          '<div class="ag-hd-note">' + noteLine + '</div>' +
        '</div>' +
        '<div class="ag-hd ag-hd-detail"><div class="ag-hd-title">Invoice View</div></div>' +
      '</div>' +
      '<div class="ag-split"><div class="ag-list-col">' +
        '<div class="pinhead" id="pinhead">' + tabs + '</div>' +
        '<div class="folder-lower">' + body + '</div>' +
      '</div>' +
      '<aside class="ag-detail" id="pmPane">' + green + '</aside></div>' +
    '</div>';
}

/* Payment invoice into the green pane - same card renderer Receivables uses. */
function loadPmInvoice(doc){
  var pane = document.getElementById("pmPane");
  if(!pane || !doc) return;
  if(ivCache[doc]){ pane.innerHTML = rcPaneHtml(ivCache[doc]); return; }
  pane.innerHTML = '<div class="empty-state"><span class="spinner"></span>Loading invoice\u2026</div>';
  jsonp({ action:"invoice", key:KEY, doc:doc }, function(data){
    if(String(state.pmSel) !== String(doc)) return;
    var p = document.getElementById("pmPane");
    if(!p) return;
    if(!data || !data.ok){
      p.innerHTML = '<div class="ag-pane-empty">' +
        esc((data && data.error) || "Could not load that invoice.") + '</div>';
      return;
    }
    ivCache[doc] = data;
    p.innerHTML = rcPaneHtml(data);
  });
}


/* The live figures. Read out of the data in front of you, never written down -
   a number that was never written down cannot go stale. */
function liveNoteFor(key){
  if(key === "receivables"){
    if(!state.loaded) return "";
    var open = (state.invoices || []).length;
    var past = (state.invoices || []).filter(function(i){ return (i.daysOver||0) > 0; }).length;
    return "<b>Right now:</b> " + open + " invoices still open, " + past + " of them past due. " +
      "Every figure on this page is QuickBooks' own balance \u2014 nothing here recalculates it.";
  }
  if(key === "payments"){
    return "<b>Note:</b> only the pay-link records itself. ACH, cheque and Paymode payments are all " +
      "keyed into QuickBooks by hand \u2014 which means somebody first has to work out who paid.";
  }
  return "";
}

function openLogic(key){
  document.getElementById("logicBody").innerHTML = logicPanelHtml(key, liveNoteFor(key));
  document.getElementById("logicModal").classList.add("show");
}
function closeLogic(){ document.getElementById("logicModal").classList.remove("show"); }
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeLogic(); });

/* ---------- body ---------- */
function renderBody(){
  var el = document.getElementById("body");

  if(state.section === "payments"){
    el.innerHTML = renderCollections();
    wireCollections();
    measurePin();
    return;
  }

  if(!state.loaded){
    el.innerHTML = '<div class="empty-state"><span class="spinner"></span>Loading invoices&hellip;</div>';
    return;
  }

  el.innerHTML = renderReceivables();
  wireBody();
  measurePin();
}

/* The sticky table header needs to sit exactly below the pinned tabs +
   green bar, whose height depends on wrapping. Measure it and hand the
   number to CSS rather than hardcoding a guess. */
/* Two things stack above a table header: the fixed slim bar, and the sticky
   tabs+search bar under it. --pinh is their combined height, which is where
   a <thead th> has to pin. Measured rather than hard-coded, because the
   tabs row wraps to two lines on a narrow window and a guessed number would
   be wrong exactly then. */
function measurePin(){
  var slim = document.getElementById("slimbar");
  var ph   = document.getElementById("pinhead");
  /* visibility:hidden still has layout, so the bar can be measured before
     it is ever shown. display:none could not be. */
  var sh = slim ? slim.getBoundingClientRect().height : 0;
  var h  = ph   ? ph.getBoundingClientRect().height   : 0;
  document.documentElement.style.setProperty("--slimh", Math.round(sh) + "px");
  document.documentElement.style.setProperty("--pinh",  Math.round(sh + h) + "px");
}
window.addEventListener("resize", measurePin);

/* The slim bar appears the moment the section switcher is about to be lost -
   not when the whole top card has finally gone, which felt late and dropped
   the bar in on top of rows already being read.

   It is a separate FIXED element that only fades. It never resizes and never
   takes part in layout, so revealing it cannot shift the page and cannot
   feed back into the scroll position that revealed it. */
(function(){
  var sentinel = document.getElementById("scoreSentinel");
  var slim = document.getElementById("slimbar");
  if(!sentinel || !slim) return;

  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      // still on screen = hide; scrolled above the top edge = show
      slim.classList.toggle("show", !entries[0].isIntersecting);
    }, { threshold: 0 });
    io.observe(sentinel);
  } else {
    var onScroll = function(){
      slim.classList.toggle("show", sentinel.getBoundingClientRect().top <= 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  /* Measure once up front. Until data lands, renderBody bails out early with
     a spinner and never reaches its own measurePin() - leaving --slimh at 0
     and the tabs pinning underneath the bar for the first scroll. */
  measurePin();
})();

/* ---------- events ---------- */
function wireBody(){
  /* Aging folders. Switching a bucket re-lands on that bucket's top invoice -
     renderReceivables handles the re-selection. */
  document.querySelectorAll(".ftab[data-age]").forEach(function(el){
    el.onclick = function(){
      state.age = el.getAttribute("data-age");
      renderBody();
    };
  });

  /* Sortable column labels in the gray list. */
  document.querySelectorAll("[data-rsort]").forEach(function(el){
    el.onclick = function(){
      var k = el.getAttribute("data-rsort");
      if(state.sortKey === k){
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = k;
        state.sortDir = (k === "cust" || k === "inv") ? "asc" : "desc";
      }
      renderBody();
    };
  });

  /* Click a row -> that invoice paints in the green pane on the right. */
  document.querySelectorAll(".agrow[data-rcrow] .aghead").forEach(function(el){
    el.onclick = function(){
      var doc = el.parentNode.getAttribute("data-rcrow");
      if(String(doc) === String(state.rcSel)) return;
      state.rcSel = String(doc);
      renderBody();
    };
  });

  var s = document.getElementById("search");
  if(s){
    s.oninput = function(){
      state.search = s.value;
      renderBody();
      var again = document.getElementById("search");
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    };
  }

  /* If the landed / selected invoice is not cached yet, fetch it into the pane
     now. Cached selections render inline during renderReceivables, so typing in
     the search box does not reload the pane on every keystroke. */
  if(state.rcSel && !ivCache[state.rcSel]) loadRcInvoice(state.rcSel);
}


function wireCollections(){
  var yr = document.getElementById("yrSel");
  if(yr){
    yr.onchange = function(){
      var y = yr.value;
      if(y === state.year) return;

      state.year = y;
      state.colSearch = "";
      state.pmSel = "";

      // Default to the newest month in that year.
      var inYear = state.months.filter(function(m){ return m.month.slice(0,4) === y; });
      state.month = inYear.length ? inYear[0].month : "";

      // Already fetched this year? Then nothing to wait for.
      if(state.payByYear[y]){
        renderSummary();
        renderBody();
      } else {
        loadCollections(y);
      }
    };
  }

  /* Month switching is a client-side filter - the whole year is already
     loaded, so no round trip. */
  document.querySelectorAll(".ftab[data-month]").forEach(function(el){
    el.onclick = function(){
      var m = el.getAttribute("data-month");
      if(m === state.month) return;
      state.month = m;
      state.colSearch = "";
      state.pmSel = "";
      renderSummary();
      renderBody();
    };
  });

  /* Sortable column labels in the gray list. */
  document.querySelectorAll("[data-pmsort]").forEach(function(el){
    el.onclick = function(){
      var k = el.getAttribute("data-pmsort");
      if(state.colSortKey === k){
        state.colSortDir = state.colSortDir === "asc" ? "desc" : "asc";
      } else {
        state.colSortKey = k;
        state.colSortDir = (k === "cust" || k === "inv") ? "asc" : "desc";
      }
      renderBody();
    };
  });

  /* Click a payment row -> its invoice paints in the green pane. */
  document.querySelectorAll(".agrow[data-pmrow] .aghead").forEach(function(el){
    el.onclick = function(){
      var doc = el.parentNode.getAttribute("data-pmrow");
      if(String(doc) === String(state.pmSel)) return;
      state.pmSel = String(doc);
      renderBody();
    };
  });

  var s = document.getElementById("colSearch");
  if(s){
    s.oninput = function(){
      state.colSearch = s.value;
      renderBody();
      var again = document.getElementById("colSearch");
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    };
  }

  if(state.pmSel && !ivCache[state.pmSel]) loadPmInvoice(state.pmSel);
}


/* Fetch a whole year (~700 rows). Months are then switched on the
   client with no further requests. */
function loadCollections(year, then){
  if(state.colLoading) return;
  state.colLoading = true;

  /* Only paint the spinner if Collections is the page being looked at.
     Financials also calls this, and must not blank someone else's body. */
  if(state.colLoaded && state.section === "payments"){
    document.getElementById("body").innerHTML =
      '<div class="empty-state"><span class="spinner"></span>Loading ' + (year || "") + '&hellip;</div>';
  }

  var params = { action:"collections", key:KEY };
  if(year) params.year = year;

  jsonp(params, function(data){
    state.colLoading = false;

    if(!data || !data.ok){
      showError((data && data.error) || "Could not load payments.");
      return;
    }
    document.getElementById("banner").className = "banner";

    state.months = data.months || [];
    state.years  = data.years  || [];
    state.ytd    = Number(data.ytd) || 0;
    state.year   = data.year || state.year;
    state.payByYear[state.year] = data.payments || [];

    // Land on the newest month of the loaded year.
    var inYear = state.months.filter(function(m){ return m.month.slice(0,4) === state.year; });
    if(!state.month || state.month.slice(0,4) !== state.year){
      state.month = inYear.length ? inYear[0].month : "";
    }

    state.colLoaded = true;

    if(then){ then(); return; }

    renderSummary();
    renderBody();
  });
}

/* Both bars carry the same two buttons, so ".sec" wires both at once. The
   ON state is set by KEY, not on the element that happened to be clicked -
   otherwise clicking Payments in the slim bar lights it there while the top
   card still insists you are on Receivables. */
var secInfo = document.getElementById("secInfo");
if(secInfo) secInfo.onclick = function(){ openLogic(state.section); };
var lgX = document.getElementById("logicClose");
if(lgX) lgX.onclick = closeLogic;
var lgM = document.getElementById("logicModal");
if(lgM) lgM.onclick = function(e){ if(e.target === lgM) closeLogic(); };

document.querySelectorAll(".sec").forEach(function(el){
  el.onclick = function(){
    var key = el.getAttribute("data-sec");
    state.section = key;
    document.querySelectorAll(".sec").forEach(function(x){
      x.classList.toggle("on", x.getAttribute("data-sec") === key);
    });

    /* Switching section from the slim bar means arriving at a new page
       already scrolled halfway down someone else's list. Go to the top -
       which also retracts the slim bar, because the real header is back. */
    window.scrollTo(0, 0);

    // Payments load on first visit, not at page load.
    if(state.section === "payments" && !state.colLoaded && !state.colLoading){
      renderSummary();
      renderBody();
      loadCollections("");
      return;
    }

    renderSummary();
    renderBody();
  };
});

/* A NOTICE, not a page failure.
   showError() below replaces the whole body - right when a load has failed,
   catastrophic when something smaller has. */
function showNote(msg, isErr){
  var b = document.getElementById("banner");
  if(!msg){ b.className = "banner"; b.innerHTML = ""; return; }
  b.innerHTML = msg;
  b.className = "banner show" + (isErr ? "" : " ok");
  if(!isErr) setTimeout(function(){
    if(b.className.indexOf("ok") !== -1) b.className = "banner";
  }, 6000);
}

function showError(msg){
  var b = document.getElementById("banner");
  b.textContent = msg;
  b.className = "banner show";
  document.getElementById("body").innerHTML =
    '<div class="empty-state">Couldn\'t load invoices.</div>';
}

/* ---------- load ---------- */
function load(){
  document.getElementById("stamp").textContent = "Loading\u2026";
  jsonp({ action:"receivables", key:KEY }, function(data){
    if(!data || !data.ok){
      showError((data && data.error) || "Could not load invoices.");
      document.getElementById("stamp").textContent = "";
      return;
    }
    document.getElementById("banner").className = "banner";
    state.invoices   = data.invoices || [];
    state.paidCount  = Number(data.paidCount) || 0;
    state.totalCount = Number(data.totalCount) || 0;
    state.loaded     = true;
    document.getElementById("stamp").textContent =
      state.totalCount.toLocaleString("en-US") + " invoices";
    renderSummary();
    renderBody();
  });
}

/* ---------- header ---------- */
document.getElementById("refreshBtn").onclick     = function(){ load(); };
document.getElementById("slimRefreshBtn").onclick = function(){ load(); };

/* No lock screen. This page carries a READ-ONLY key that the Apps Script
   accepts for three actions and nothing else, so there is nothing to enter
   and nothing here worth stealing that the page does not already show. */
load();

</script>
<script id="m-acct-js">
/* ===== mobile layer (<=860px) =====
   Injects the fixed topbar, the drawer backdrop and the "Back to list"
   button, then toggles two classes: .m-open on the rail, and .m-detail on
   the body. All positioning lives in m-acct-css behind the media query, so
   this is inert on desktop apart from three hidden elements. */
(function(){
  var rail = document.querySelector('.wn-rail');
  if(!rail) return;

  var tb = document.createElement('div');
  tb.className = 'm-topbar';
  tb.innerHTML = '<button class="m-burger" id="mBurger" aria-label="Menu">\u2630</button>' +
                 '<span class="m-title">WasteNet Accounting</span>';
  var bd = document.createElement('div'); bd.className = 'm-backdrop'; bd.id = 'mBackdrop';
  var bk = document.createElement('button'); bk.className = 'm-back'; bk.id = 'mBack';
  bk.innerHTML = '\u2039 Back to list';
  document.body.appendChild(tb);
  document.body.appendChild(bd);
  document.body.appendChild(bk);

  function openRail(){ rail.classList.add('m-open'); bd.classList.add('m-open'); }
  function closeRail(){ rail.classList.remove('m-open'); bd.classList.remove('m-open'); }

  document.getElementById('mBurger').addEventListener('click', openRail);
  bd.addEventListener('click', closeRail);

  // Choosing a section (or the dashboard picker) closes the drawer and drops
  // any open detail - the new section's list should be what you land on.
  rail.addEventListener('click', function(e){
    var t = e.target;
    if(!t.closest) return;
    if(t.closest('.wn-rail__sections .sec, .wn-tri, .wn-item')){
      document.body.classList.remove('m-detail');
      setTimeout(closeRail, 80);
    }
  });

  /* Agents, Receivables, Payments and Billing use the slide-in panel;
     Financials and Deposits stack their detail below the list instead
     (see m-acct-css), so they must never set .m-detail. */
  function slideInFolder(){
    return document.querySelector(
      '.folder.ag-folder, .folder.rc-folder:not(.dz-folder), .folder.bill-folder');
  }
  /* The Agents strip carries the agent name, address and Email Statement
     button, and any of those can wrap - so its height is measured rather
     than assumed, and the panel pads itself by that much. The Back button's
     width is measured for the same reason: it floats over the strip, and a
     guessed gap left it sitting on the agent's name.
     Order matters - the button only has a width once .m-detail is set, so
     the caller adds the class first and measures second. */
  function measureHead(){
    var b = document.getElementById('mBack');
    if(b && b.offsetWidth) document.body.style.setProperty('--m-back-w', b.offsetWidth + 'px');
    var h = document.querySelector('.ag-folder .ag-hd-detail');
    if(h) document.body.style.setProperty('--m-dhead-h', h.offsetHeight + 'px');
  }
  function syncDetail(){
    var f = slideInFolder();
    if(f && f.querySelector('.agrow.open')){
      document.body.classList.add('m-detail');
      measureHead();
    } else {
      document.body.classList.remove('m-detail');
    }
  }

  /* Navigating is not the same as selecting.
     The sections auto-open the first row so the desktop pane is never empty
     (agentsHtml does this explicitly). That means "a row is open" is true the
     moment a section renders, and inferring the panel from it alone sent you
     straight past the list into the first agent's statement on arrival.
     So: only a tap on a row header opens the panel. Section buttons and the
     month/bucket tabs are navigation - they only ever close it. */
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    if(e.target.closest('.aghead')){
      setTimeout(syncDetail, 60);                       // may open
    } else if(e.target.closest('.sec, .folder-tabs')){
      document.body.classList.remove('m-detail');       // never opens
    }
  });
  window.addEventListener('resize', function(){
    if(document.body.classList.contains('m-detail')) measureHead();
  });

  bk.addEventListener('click', function(){ document.body.classList.remove('m-detail'); });
})();

</script>
</body>
