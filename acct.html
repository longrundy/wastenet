<!DOCTYPE html>
<!-- wastenet-accounting · build 2026-07-20-f header titles rail-green -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WasteNet Receivables &amp; Payments</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  :root{
    --green:#5CAA16; --green-dark:#3B6D11; --green-darker:#27500A;
    --green-tint:#EAF3DE; --green-tint-2:#F4FAEC; --green-border:#C0DD97;
    --amber:#EF9F27; --amber-dark:#854F0B; --amber-tint:#FAEEDA;
    --coral:#D85A30; --coral-dark:#712B13; --coral-tint:#FAECE7;
    --red:#E24B4A; --red-dark:#A32D2D; --red-darker:#791F1F; --red-tint:#FCEBEB;
    --ink:#1A1D1A; --ink-2:#525A60; --ink-3:#8A8F8A;
    --line:#E4E7E0; --line-strong:#CFD4CA;
    --card:#FFFFFF; --panel:#F6F7F3; --page:#FAFBF8;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --pinh:0px; --slimh:0px;

    /* ---- SHAPE ----
       Chrome is rectangular, tokens are round.
       Anything that FRAMES content - a toolbar control, a card, a menu, an
       inner panel - is a rectangle. Anything that IS a small piece of
       content - a status you read, a filter you toggle - is a pill.
       That one line decides every future case without another audit.

       These six values are identical in wastenet-monitor.html. The two
       dashboards do different jobs; they should not look like they were
       drawn by different people. Before this there were SEVEN radii doing
       four jobs, and the same control was 14px on one dashboard and 8px on
       the other. */
    --r-input:6px;    /* text fields */
    --r-ctl:8px;      /* buttons, selects, dropdown triggers, search, inner panels */
    --r-menu:10px;    /* popovers */
    --r-card:12px;    /* containers, cards, list wrappers */
    --r-pill:999px;   /* status chips and filter toggles */
    --h-ctl:30px;     /* every toolbar control is this tall */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); background:var(--page); color:var(--ink);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  /* Identical in wastenet-monitor.html. The two pages sat at different
     distances from the top of the window - 16px here, 20px there - which is
     the sort of thing you cannot unsee once you have switched between them
     twice. */
  /* ---- the (i): "how is this worked out?" ---- */
  .lg-i{width:19px; height:19px; padding:0; flex:0 0 auto; margin-left:2px;
        border:0.5px solid var(--line-strong); border-radius:var(--r-pill);
        background:var(--card); color:var(--ink-3); cursor:pointer;
        font-family:Georgia,'Times New Roman',serif; font-style:italic;
        font-size:12px; line-height:1; display:inline-flex; align-items:center;
        justify-content:center; transition:color .12s, border-color .12s;}
  .lg-i:hover{color:var(--green-dark); border-color:var(--green);}

  .lg-modal{position:fixed; inset:0; z-index:200; display:none;
            background:rgba(20,24,20,0.34); padding:24px; overflow-y:auto;}
  .lg-modal.show{display:block;}
  .lg-card{max-width:640px; margin:40px auto; background:var(--card);
           border:0.5px solid var(--line-strong); border-radius:var(--r-card);
           box-shadow:0 8px 40px rgba(0,0,0,0.14); padding:26px 28px 20px; position:relative;}
  .lg-x{position:absolute; top:12px; right:14px; width:26px; height:26px; padding:0;
        border:none; background:transparent; color:var(--ink-3); font-size:20px;
        line-height:1; cursor:pointer; border-radius:var(--r-ctl);}
  .lg-x:hover{background:var(--panel); color:var(--ink);}
  .lg-head{border-bottom:0.5px solid var(--line); padding-bottom:13px; margin-bottom:14px;}
  .lg-title{font-size:17px; font-weight:600; margin-bottom:4px;}
  .lg-short{font-size:13px; color:var(--ink-2);}
  .lg-body p{font-size:13.5px; line-height:1.65; margin:0 0 11px;}
  .lg-list{margin:0 0 11px; padding-left:18px;}
  .lg-list li{font-size:13.5px; line-height:1.6; margin-bottom:7px;}
  .lg-list b{color:var(--green-darker);}
  /* The live figures - the one part of the panel that is not prose. They are
     read out of the data in front of you, which is why this explanation cannot
     quietly go out of date. */
  .lg-live{margin:14px 0 0; padding:11px 13px; background:var(--green-tint-2);
           border:0.5px solid var(--green-border); border-radius:var(--r-ctl);
           font-size:12.5px; line-height:1.65; color:var(--green-darker);}
  .lg-src{margin-top:12px; padding:10px 13px; background:var(--panel);
          border-radius:var(--r-ctl); font-size:11.5px; line-height:1.6; color:var(--ink-2);}
  .lg-foot{margin-top:14px; padding-top:12px; border-top:0.5px solid var(--line);
           font-size:11.5px; line-height:1.6; color:var(--ink-3);}
  .lg-foot a{color:var(--green-dark); font-weight:600; text-decoration:none; white-space:nowrap;}
  .lg-foot a:hover{text-decoration:underline;}

  /* The header has two sides and they mean different things. LEFT is where you
     are - brand, view menu, and now Contacts. RIGHT is tools that act on what
     you are looking at - search, date, refresh. Contacts was on the right, next
     to the search box, which is exactly why it read as "search contacts". */
  .navlink{font-size:12.5px; font-weight:500; color:var(--ink); text-decoration:none;
           height:var(--h-ctl); padding:0 11px; border:0.5px solid var(--line-strong);
           border-radius:var(--r-ctl); display:inline-flex; align-items:center;
           white-space:nowrap; transition:background .12s, border-color .12s, color .12s;}
  .navlink:hover{background:var(--green-tint); border-color:var(--green-border);
                 color:var(--green-darker);}

  .wrap{max-width:820px; margin:0 auto; padding:20px 16px 80px;}

  /* ---- top card: brand + sections + compact scorecard ---- */
  /* The top card scrolls away NORMALLY - it is not sticky, and it never
     resizes. A separate fixed .slimbar fades in once it leaves. Two
     independent elements that never change size is what keeps this from
     shifting the page or feeding back into its own scroll trigger. The
     old design pinned the month tabs at top:0 and let the section
     switcher scroll off entirely, which meant that halfway down a list
     you could no longer get to Payments without scrolling back up. */
  .topcard{border:0.5px solid var(--line); border-radius:var(--r-card); background:var(--card); padding:10px 14px 12px; margin-bottom:14px;}

  .slimbar{position:fixed; left:0; right:0; top:0; z-index:60; background:var(--card);
           border-bottom:0.5px solid var(--line-strong); box-shadow:0 3px 12px rgba(0,0,0,0.10);
           opacity:0; visibility:hidden; transition:opacity .15s ease, visibility .15s ease;}
  .slimbar.show{opacity:1; visibility:visible;}
  .slimbar-inner{max-width:820px; margin:0 auto; padding:7px 16px;
                 display:flex; align-items:center; gap:10px;}
  .slimbar .brand{flex:0 0 auto;}
  /* The four sections are the whole point of the bar - they get the room. */
  .slimbar .sections{margin-bottom:0; flex:1 1 auto; justify-content:flex-end;
                     flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;}
  .slimbar .sections::-webkit-scrollbar{display:none;}
  .slimbar .sec{padding:4px 11px; font-size:11.5px;}
  .slimbar .btn{flex:0 0 auto;}
  @media (max-width:640px){
    .slimbar .brand-name, .slimbar .brand-div{display:none;}
  }

  .header-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .brand-name{font-size:15px; font-weight:800; letter-spacing:0.04em; color:var(--green); flex:0 0 auto;}
  .brand-logo{height:24px; width:auto; display:block; flex:0 0 auto;}
  .brand-div{width:1px; height:14px; background:var(--line-strong); flex:0 0 auto;}
  .header-right{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .stamp{font-size:10.5px; color:var(--ink-3); white-space:nowrap;}
  .btn{font-size:12px; color:var(--ink); background:var(--card); border:0.5px solid var(--line-strong); height:var(--h-ctl); padding:0 11px; border-radius:var(--r-ctl); cursor:pointer; font-family:var(--font); display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; transition:background .12s;}
.btn.primary{background:var(--green); border-color:var(--green); color:#fff; font-weight:500;}
.btn.primary:hover{background:var(--green-dark); border-color:var(--green-dark);}
  .btn:hover{background:var(--panel);}

  /* A bare word with a 9px grey arrow next to it does not read as a control.
     It reads as a label that happens to have a speck beside it. Give it the
     chrome of the thing it actually is: a button that opens a menu. */
  .viewnav{position:relative; flex:0 0 auto;}
  .view-label{font-size:12.5px; font-weight:500; color:var(--ink); font-family:var(--font);
              background:var(--card); border:0.5px solid var(--line-strong);
              height:var(--h-ctl); padding:0 9px 0 11px; border-radius:var(--r-ctl);
              cursor:pointer; display:inline-flex; align-items:center; gap:6px;
              white-space:nowrap; box-sizing:border-box;
              transition:background .12s, border-color .12s;}
  .view-label:hover{background:var(--panel); border-color:var(--ink-3);}
  .view-label.open{background:var(--green-tint); border-color:var(--green-border); color:var(--green-darker);}
  .view-caret{font-size:11px; color:var(--ink-2); transition:transform .14s ease;}
  .view-label:hover .view-caret{color:var(--ink);}
  .view-label.open .view-caret{transform:rotate(180deg); color:var(--green-dark);}
  .view-drop{position:absolute; top:100%; left:0; margin-top:6px; background:var(--card); border:0.5px solid var(--line-strong); border-radius:var(--r-menu); box-shadow:0 4px 14px rgba(0,0,0,0.10); min-width:190px; z-index:80; display:none; overflow:hidden;}
  .view-drop.open{display:block;}
  .view-opt{display:block; width:100%; text-align:left; padding:9px 14px; font-size:13px; color:var(--ink); background:transparent; border:none; cursor:pointer; font-family:var(--font);}
  .view-opt:hover{background:var(--panel);}
  .view-opt.cur{color:var(--green-dark); font-weight:600; background:var(--green-tint-2);}

  /* section switcher */
  .sections{display:flex; gap:6px; margin-bottom:11px; flex-wrap:wrap;}
  .sec{
    font-size:12px; font-weight:500; font-family:var(--font);
    padding:5px 13px; border-radius:var(--r-pill); cursor:pointer; white-space:nowrap;
    border:0.5px solid var(--line-strong); background:var(--card); color:var(--ink-2);
    transition:background .12s, color .12s, border-color .12s;
  }
  .sec:hover:not(.on){background:var(--panel);}
  .sec.on{background:var(--green); border-color:var(--green); color:#fff;}

  /* compact scorecard - one strip, four figures */
  .score{display:flex; border:0.5px solid var(--line); border-radius:var(--r-card); overflow:hidden;}
  .score-cell{flex:1; min-width:0; padding:8px 6px; text-align:center; border-right:0.5px solid var(--line);}
  .score-cell:last-child{border-right:none;}
  .score-n{font-size:17px; font-weight:600; letter-spacing:-0.01em; line-height:1.2;}
  .score-l{font-size:10px; color:var(--ink-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .n-ink{color:var(--ink);}
  .n-red{color:var(--red-dark);}
  .n-green{color:var(--green-dark);}

  /* ---- deposits: the Frost statement, against the invoices ---- */
  .dz{border:1px dashed var(--line-strong); border-radius:var(--r-card); padding:28px 20px;
      text-align:center; background:var(--panel); transition:border-color .12s, background .12s;}
  .dz.over{border-color:var(--green); background:var(--green-tint-2);}
  .dz-t{font-size:14px; font-weight:600; margin-bottom:5px;}
  .dz-d{font-size:12px; color:var(--ink-2); line-height:1.6; max-width:420px; margin:0 auto;}
  .dpaste{width:100%; margin-top:12px; padding:9px 11px;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          font-size:11px; border:0.5px solid var(--line-strong); border-radius:var(--r-input);
          resize:vertical; outline:none; color:var(--ink); background:var(--card);}
  .dpaste:focus{border-color:var(--green);}
  .dnote{margin-top:16px; padding:10px 13px; background:var(--green-tint-2);
         border:0.5px solid var(--green-border); border-radius:var(--r-ctl);
         font-size:11.5px; color:var(--green-darker); line-height:1.6;}

  .drow{padding:11px 4px; border-bottom:0.5px solid var(--line);}
  .drow:last-child{border-bottom:none;}
  /* A deposit needing nothing should not compete for attention with one that
     does. It stays on the page - it happened - but it recedes. */
  .drow.quiet{opacity:0.5;}
  .drow.quiet:hover{opacity:1;}
  .dmain{display:flex; align-items:center; gap:10px;}
  .dc-date{width:74px; flex:0 0 74px; font-size:11.5px; color:var(--ink-2); white-space:nowrap;}
  .ddesc{flex:1; min-width:0; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .damt{width:96px; flex:0 0 96px; text-align:right; font-size:13.5px; font-weight:600;}
  .dtag{width:112px; flex:0 0 112px; text-align:right;}
  .dwho{font-size:11.5px; color:var(--ink-2); margin-top:5px; padding-left:84px;}
  .dwhy{font-size:11.5px; color:var(--ink-2); line-height:1.6; margin-top:6px; margin-left:84px;
        padding:7px 10px; background:var(--panel); border-radius:var(--r-ctl);}

  /* Already recorded. The receipt, not just the assertion - which payment,
     keyed when. A confirmation you cannot check is just a claim. */
  .ddone{margin-top:6px; margin-left:84px; padding:7px 11px; display:flex; flex-wrap:wrap;
         align-items:center; gap:4px 10px;
         background:var(--green-tint-2); border:0.5px solid var(--green-border);
         border-radius:var(--r-ctl);}
  .dd-t{font-size:11px; font-weight:700; color:var(--green-darker); flex:0 0 auto; min-width:74px;}

  .dcands{margin-top:7px; padding-left:84px; display:flex; flex-direction:column; gap:5px;}
  .dhint{font-size:11px; color:var(--amber-dark); margin-bottom:2px; line-height:1.5;}
  /* Each candidate is a whole answer, so it is one button - you take it or you
     do not. Ticking invoices one at a time would invite a combination that adds
     up to nothing. */
  .dcand{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; width:100%; text-align:left;
         padding:8px 11px; border:0.5px solid var(--line-strong); border-radius:var(--r-ctl);
         background:var(--card); cursor:pointer; font-family:var(--font);
         transition:background .12s, border-color .12s;}
  .dcand:hover{border-color:var(--green); background:var(--green-tint-2);}
  .dcand.on{border-color:var(--green); background:var(--green-tint);}
  .dc-sum{font-size:12.5px; font-weight:700; color:var(--green-darker); flex:0 0 auto;
          min-width:74px;}
  .dc-inv{font-size:11.5px; color:var(--ink-2); white-space:nowrap;}
  .dc-inv b{color:var(--green-dark);}
  .dc-amt{color:var(--ink-3);}

  /* ---- folder: five tabs, one body. Tabs + bar pin on scroll. ---- */
  .folder{margin-bottom:20px;}

  /* The tabs pin BELOW the slim bar, not under it. By the time the tabs
     reach the top the slim bar is always already showing - the sentinel
     that reveals it sits higher up the page - so this offset is always
     the right one. */
  .pinhead{position:sticky; top:var(--slimh); z-index:30; background:var(--page); padding-top:6px;}

  .folder-tabs{display:flex; gap:4px; flex-wrap:wrap; padding-left:2px;}
  /* Months don't wrap - a year of them would stack three deep. Scroll
     sideways instead, newest first. */
  .folder-tabs.scroll{flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; padding-bottom:0;}
  .folder-tabs.scroll::-webkit-scrollbar{display:none;}
  .folder-tabs.scroll .ftab{flex:0 0 auto;}

  /* There are years of months, so the tab strip scrolls sideways. The
     fade is on the WRAPPER, not the scroller - on the scroller it would
     slide away with the content and stop meaning anything. It hides
     itself once you reach the end. */
  /* year picker - first thing in the green bar */
  .yrsel{
    font-size:12px; font-family:var(--font); font-weight:600;
    color:var(--green-dark); background:var(--card);
    border:0.5px solid var(--green-border); border-radius:var(--r-ctl);
    height:var(--h-ctl); box-sizing:border-box;
    padding:0 28px 0 13px; cursor:pointer; outline:none; flex:0 0 auto;
    max-width:190px;
    /* the native arrow sits flush against the text in a control this small,
       so draw our own and give it room */
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%233B6D11' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 10px center;
  }
  .yrsel:focus{border-color:var(--green);}

  .tabscroll{position:relative;}  .tabscroll{position:relative;}
  .tabscroll::after{
    content:""; position:absolute; top:0; right:0; bottom:0; width:44px;
    pointer-events:none; opacity:1; transition:opacity .15s;
    background:linear-gradient(to right, rgba(250,251,248,0), var(--page) 72%);
  }
  .tabscroll.at-end::after{opacity:0;}
  .ftab{
    display:inline-flex; align-items:center;
    background:var(--green-tint); border:0.5px solid var(--green-border);
    border-bottom:none; border-radius:var(--r-menu) var(--r-menu) 0 0;
    padding:7px 13px 8px; font-size:12px; font-weight:600;
    color:var(--green-dark); cursor:pointer; font-family:var(--font);
    white-space:nowrap; position:relative; z-index:1; margin-bottom:-1px;
    transition:background .12s, color .12s;
  }
  .ftab:hover:not(.sel){background:var(--green-border);}
  .ftab.sel{background:var(--card); color:var(--green-darker); z-index:3; padding-bottom:9px;}

  /* the green bar - last thing that stays put when you scroll */
  .fbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px; background:var(--green-tint-2);
    border-left:0.5px solid var(--green-border);
    border-right:0.5px solid var(--green-border);
    border-top:0.5px solid var(--green-border);
    border-bottom:0.5px solid var(--line);
    position:relative; z-index:2;
  }
  .fbar-t{font-size:12.5px; font-weight:600; color:var(--green-darker); min-width:0; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fbar-t .amt{font-weight:400; color:var(--green-dark); font-size:11.5px;}

  .search{font-size:11.5px; height:var(--h-ctl); padding:0 10px; border:0.5px solid var(--green-border); border-radius:var(--r-ctl); width:165px; outline:none; font-family:var(--font); color:var(--ink); background:var(--card); flex:0 0 auto; box-sizing:border-box;}
  .search:focus{border-color:var(--green);}

  .folder-lower{
    border-left:0.5px solid var(--green-border);
    border-right:0.5px solid var(--green-border);
    border-bottom:0.5px solid var(--green-border);
    border-radius:0 0 var(--r-card) var(--r-card);
    background:var(--card); padding:0 16px 6px;
  }

  table{width:100%; border-collapse:collapse; table-layout:fixed;}
  thead th{
    position:sticky; top:var(--pinh); z-index:5; background:var(--card);
    font-size:10.5px; font-weight:600; color:var(--ink-2); text-align:left;
    padding:7px 4px; border-bottom:0.5px solid var(--line-strong);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th:hover{color:var(--ink);}
  th .sc{color:var(--ink-3); font-size:9px;}
  td{padding:8px 4px; border-bottom:0.5px solid var(--line); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel);}
  .num{text-align:right;}
  .muted{color:var(--ink-2);}

  /* invoice numbers link straight into QuickBooks */
  .ilink{color:var(--green-dark); text-decoration:none; border-bottom:1px dotted var(--green-border);}
  .ilink:hover{color:var(--green-darker); border-bottom-color:var(--green); background:var(--green-tint-2);}
  .agflag .ilink{color:var(--amber-dark); border-bottom-color:var(--amber);}
  .agflag .ilink:hover{background:rgba(255,255,255,0.5);}

  .chip{display:inline-block; padding:2px 8px; border-radius:var(--r-pill); font-size:10.5px; font-weight:600; white-space:nowrap;}
  .chip-cur{background:var(--green-tint); color:var(--green-darker);}
  .chip-30{background:var(--amber-tint); color:var(--amber-dark);}
  .chip-60{background:var(--coral-tint); color:var(--coral-dark);}
  .chip-90{background:var(--red-tint); color:var(--red-dark);}
  .chip-90p{background:var(--red-tint); color:var(--red-darker);}

  /* agent payout rows */
  /* Where an agent's statement is sent. Kept on Agent Settings, not in the box
     contacts - John Lydick has no business being copied on a hauler's pickup. */
  .agmail{display:flex; align-items:center; gap:8px; margin-bottom:11px;
          padding:8px 11px; background:var(--green-tint-2);
          border:0.5px solid var(--green-border); border-radius:var(--r-ctl);
          font-size:12px;}
  .agmail.none{background:var(--panel); border-color:var(--line-strong);}
  .agmail-l{color:var(--ink-2); flex:0 0 auto;}
  .agmail-v{font-weight:600; color:var(--green-darker); flex:1; min-width:0;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .agmail-v.muted{font-weight:400; color:var(--ink-3);}
  /* The "fetching" notice belongs WHERE THE WORK IS - under the button that
     started it, on the agent it is fetching for. At the top of the page it was
     three tabs away from the thing you clicked, and read like a page-level
     event rather than a row-level one. */
  .agfetch{display:flex; align-items:center; gap:8px; margin-top:6px;
    padding:8px 12px; border-radius:var(--r-ctl); font-size:12px; font-weight:600;
    background:#FFF4CC; border:0.5px solid #E8C55A; color:#7A5B00;}
  .agspin{width:12px; height:12px; flex:0 0 auto; border:2px solid #E8C55A;
    border-top-color:#7A5B00; border-radius:50%; animation:agspin .7s linear infinite;}
  @keyframes agspin{to{transform:rotate(360deg);}}

  .stmt-btn{font-family:var(--font); font-size:11.5px; font-weight:600; padding:3px 10px;
    border-radius:var(--r-pill); border:0.5px solid var(--green); background:var(--green);
    color:#fff; cursor:pointer; margin-left:8px;}
  .stmt-btn:hover{background:var(--green-dark); border-color:var(--green-dark);}
  .stmt-sent{font-size:11px; color:var(--ink-3); margin-left:8px;}

  .stmt-modal{position:fixed; inset:0; z-index:200; display:none;
    align-items:center; justify-content:center; padding:24px; background:rgba(26,29,26,0.45);}
  .stmt-modal.show{display:flex;}
  /* A DEFINITE height, not a max.
     An iframe has no intrinsic content height - the browser cannot ask the
     document inside how tall it wants to be - so with only a max-height the
     card collapsed to the frame's min-height and the preview came out letterbox
     sized. Give the card a real height and flex:1 has something to fill. */
  .stmt-card{width:min(1000px,100%); height:min(90vh, 940px); display:flex; flex-direction:column;
    background:var(--card); border-radius:var(--r-card); overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.22);}
  .stmt-top{display:flex; align-items:center; gap:12px; padding:15px 18px;
    border-bottom:0.5px solid var(--line);}
  .stmt-h{font-size:15px; font-weight:600;}
  .stmt-sub{font-size:12px; color:var(--ink-2); margin-top:2px;}
  .stmt-warn{padding:10px 18px; background:var(--amber-tint,#FDF3E3); color:var(--amber-dark);
    font-size:12.5px; font-weight:600; border-bottom:0.5px solid var(--line);}
  .stmt-foot{display:flex; align-items:center; gap:10px; padding:13px 18px;
    border-top:0.5px solid var(--line); background:var(--card);}
  .stmt-subj{font-size:12px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stmt-x{font-family:var(--font); font-size:12.5px; height:var(--h-ctl); padding:0 13px;
    border-radius:var(--r-ctl); border:0.5px solid var(--line-strong); background:var(--card);
    color:var(--ink-2); cursor:pointer;}
  .stmt-send{font-family:var(--font); font-size:12.5px; font-weight:600; height:var(--h-ctl);
    padding:0 16px; border-radius:var(--r-ctl); border:none; background:var(--green);
    color:#fff; cursor:pointer;}
  .stmt-send:disabled{opacity:0.6; cursor:default;}
  /* two-pane statement redesign */
  .st-panes{display:flex; flex:1 1 auto; min-height:0;}
  .st-left{width:46%; overflow-y:auto; padding:16px 18px; border-right:0.5px solid var(--line); display:flex; flex-direction:column;}
  .st-right{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel);}
  .st-rhead{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-3); font-weight:700; padding:12px 16px 8px; flex:0 0 auto;}
  .st-rsum{margin:0 16px 10px; background:var(--card); border:0.5px solid var(--line); border-radius:8px; padding:9px 12px; font-size:12.5px; color:var(--ink-2); flex:0 0 auto;}
  .st-rsum b{color:var(--ink);}
  .st-rsum .sep{color:var(--line-strong); margin:0 5px;}
  @media(max-width:820px){ .st-panes{flex-direction:column;} .st-left{width:auto; border-right:0; border-bottom:0.5px solid var(--line);} }
  .st-rfield{position:relative; border:1px solid var(--line-strong); border-radius:10px; padding:8px 8px 9px; margin-bottom:13px; background:var(--card);}
  .st-rfield.focus{border-color:var(--green); box-shadow:0 0 0 3px var(--green-tint);}
  .st-rlabel{position:absolute; top:-8px; left:12px; background:var(--card); padding:0 6px; font-size:11px; font-weight:600; color:var(--ink-2);}
  .st-rbox{display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:30px;}
  .st-tok{display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--panel); border:0.5px solid var(--line-strong); border-radius:var(--r-pill); padding:3px 6px 3px 10px; max-width:100%;}
  .st-tok.agent{background:var(--green-tint); border-color:var(--green-border); color:var(--green-darker);}
  .st-tok.staff{background:var(--amber-tint); border-color:#E6C99B; color:var(--amber-dark);}
  .st-tok .a{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:210px;}
  .st-tok .tx{border:0; background:none; cursor:pointer; color:inherit; opacity:0.55; font-size:14px; line-height:1; padding:0 1px;}
  .st-tok .tx:hover{opacity:1;}
  .st-rin{flex:1; min-width:110px; border:0; outline:0; background:none; font-family:var(--font); font-size:13px; color:var(--ink); height:24px;}
  .st-addbtn{font-size:11.5px; font-weight:600; color:var(--green-dark); background:var(--green-tint-2); border:0.5px solid var(--green-border); border-radius:var(--r-pill); padding:3px 10px; cursor:pointer; white-space:nowrap; font-family:var(--font);}
  .st-addbtn:hover{background:var(--green-tint);}
  .st-menu{position:absolute; top:calc(100% - 2px); right:8px; background:var(--card); border:0.5px solid var(--line-strong); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.12); padding:5px; min-width:210px; z-index:10;}
  .st-menu .sec{font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-3); font-weight:700; padding:6px 8px 3px;}
  .st-menu .mi{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; font-family:var(--font); font-size:12.5px; color:var(--ink); padding:7px 8px; border-radius:6px; cursor:pointer;}
  .st-menu .mi:hover{background:var(--panel);}
  .st-menu .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
  .st-menu .mi .n{margin-left:auto; color:var(--ink-3); font-size:11px;}
  .st-ta{position:absolute; left:8px; right:8px; top:calc(100% - 2px); background:var(--card); border:0.5px solid var(--line-strong); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.12); padding:5px; z-index:12;}
  .st-ta .opt{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:6px; cursor:pointer; font-size:12.5px;}
  .st-ta .opt:hover{background:var(--panel);}
  .st-ta .opt b{font-weight:600;}
  .st-ta .opt .role{margin-left:auto; font-size:10px; color:var(--ink-3);}
  .st-note-lab{font-size:12px; font-weight:600; color:var(--ink-2); margin:6px 0 4px;}
  .st-hint{font-size:11px; color:var(--ink-3); margin-bottom:6px;}
  .st-note{width:100%; font-family:var(--font); font-size:13px; color:var(--ink); border:1px solid var(--line-strong); border-radius:6px; background:var(--card); padding:9px 10px; line-height:1.5; min-height:100px; resize:vertical;}
  .st-note:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-tint);}
  .st-frame-wrap{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 16px 16px; min-height:0;}
  .st-frame-inner{position:relative;}
  .stmt-frame{position:absolute; top:0; left:0; width:624px; border:0; background:#FAFBF8; transform-origin:top left; display:block;}

  /* View mode: statement centred with room around it, not squeezed in a pane. */
  .st-frame-wrap-full{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:18px 20px; min-height:0; background:var(--panel);}
  .st-frame-wrap-full .st-frame-inner{margin:0 auto;}
  /* Send mode: a compact box - recipients and note only, no second preview. */
  .stmt-card-send{width:min(480px,100%); height:auto; max-height:90vh;}
  .st-send-body{padding:18px 18px 8px; overflow-y:auto;}
  .st-send-body .st-rfield:first-child{margin-top:4px;}
  /* Brand-green header on the statement modals (view + send), by variable so it
     matches the logo and the rest of the page. Footer stays light so the green
     Send / Email button still stands out. */
  .stmt-top{background:var(--green);}
  .stmt-top .stmt-h{color:#fff;}
  .stmt-top .stmt-sub{color:rgba(255,255,255,0.88);}
  .stmt-top .stmt-x{color:#fff; background:transparent; border-color:rgba(255,255,255,0.55);}
  .stmt-top .stmt-x:hover{background:rgba(255,255,255,0.14);}
  /* Send footer: subject on its own full-width line so it never truncates. */
  .stmt-foot-send{flex-direction:column; align-items:stretch; gap:9px;}
  .stmt-foot-send .stmt-subj-full{font-size:12px; color:var(--ink-2); white-space:normal; word-break:break-word;}
  .stmt-foot-send .stmt-foot-actions{display:flex; justify-content:flex-end; gap:10px;}

  .agmail-e{font-size:11px; color:var(--green-dark); background:transparent;
            border:none; cursor:pointer; padding:2px 6px; border-radius:var(--r-input);
            font-family:var(--font); flex:0 0 auto;}
  .agmail-e:hover{background:var(--green-tint);}

  .agrow{border-bottom:0.5px solid var(--line);}
  .agrow:last-child{border-bottom:none;}

  /* An OPEN agent becomes a bounded card. Without this the detail table
     runs straight into the next agent's row, and the eye reads the next
     agent's payout as if it belonged to the expanded one - on a page
     about money, that is a misreading worth designing out. */
  .agrow.open{
    border:0.5px solid var(--green-border);
    border-radius:var(--r-card);
    background:var(--green-tint-2);
    margin:8px 0 12px;
    box-shadow:0 1px 6px rgba(0,0,0,0.04);
  }
  .agrow.open + .agrow{border-top:none;}

  .aghead{display:flex; align-items:center; gap:10px; padding:11px 4px; cursor:pointer;}
  .aghead:hover{background:var(--panel);}
  .agrow.open .aghead{
    padding:11px 12px;
    background:transparent;
    border-bottom:0.5px solid var(--green-border);
    border-radius:var(--r-card) var(--r-card) 0 0;
  }
  .agrow.open .aghead:hover{background:rgba(255,255,255,0.4);}

  .agcaret{font-size:9px; color:var(--ink-3); width:10px; flex:0 0 auto; transition:transform .12s;}
  .agrow.open .agcaret{transform:rotate(90deg); color:var(--green-dark);}
  .agname{font-size:13.5px; font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .agrow.open .agname{color:var(--green-darker);}
  .agshare{font-size:10.5px; color:var(--ink-3); background:var(--panel); border-radius:var(--r-pill); padding:2px 7px; flex:0 0 auto;}
  .agrow.open .agshare{background:var(--card);}
  .agmeta{font-size:11px; color:var(--ink-2); flex:0 0 auto; text-align:right; white-space:nowrap;}
  .agpay{font-size:15px; font-weight:600; color:var(--green-dark); flex:0 0 auto; text-align:right; min-width:88px;}

  .agdetail{display:none;}
  .agrow.open .agdetail{
    display:block;
    padding:11px 12px 4px;
    background:var(--card);
    border-radius:0 0 var(--r-card) var(--r-card);
  }
  /* the detail table sits on white, so it needs its own quiet frame */
  .agrow.open .agdetail table{margin-top:2px;}
  .agrow.open .agdetail thead th{background:var(--card); position:static;}
  .agmath{font-size:11.5px; color:var(--ink-2); background:var(--panel); border:0.5px solid var(--line); border-radius:var(--r-ctl); padding:9px 12px; margin-bottom:10px; line-height:1.7;}
  .agmath b{color:var(--ink); font-weight:600;}

  .agflag{background:var(--amber-tint); border:0.5px solid var(--amber); color:var(--amber-dark); border-radius:var(--r-ctl); padding:8px 11px; font-size:11.5px; margin-bottom:9px;}

  .soon{border:0.5px solid var(--line); border-radius:var(--r-card); background:var(--card); padding:30px 26px; text-align:center;}
  .soon-disc{width:52px; height:52px; border-radius:50%; margin:0 auto 14px; background:var(--green-tint); border:1px solid var(--green-border); display:flex; align-items:center; justify-content:center; color:var(--green-dark);}
  .soon-disc svg{width:24px; height:24px;}
  .soon-t{font-size:15px; font-weight:600; margin-bottom:5px;}
  .soon-tag{display:inline-block; font-size:10.5px; font-weight:600; color:var(--amber-dark); background:var(--amber-tint); padding:2px 9px; border-radius:var(--r-pill); margin-bottom:12px;}
  .soon-d{font-size:13px; color:var(--ink-2); line-height:1.6; max-width:440px; margin:0 auto 16px;}
  .soon-list{text-align:left; max-width:390px; margin:0 auto; font-size:12.5px; color:var(--ink-2); line-height:1.9;}
  .soon-list li{margin:0;}
  .soon-note{margin-top:16px; font-size:11.5px; color:var(--ink-3); font-style:italic;}

  .empty-state{text-align:center; padding:36px 16px; color:var(--ink-2); font-size:13px;}
  .banner{display:none; border-radius:var(--r-card); padding:10px 14px; font-size:13px; margin-bottom:14px;}
  .banner.show{display:block; background:var(--red-tint); color:var(--red-darker); border:0.5px solid var(--red);}
  /* Must come AFTER .banner.show and out-specify it. Defined earlier and at equal
     weight, red simply won - and a progress message read as a failure. */
  .banner.show.ok{background:var(--green-tint-2); color:var(--green-darker);
                  border:0.5px solid var(--green-border);}

  @keyframes spin{to{transform:rotate(360deg);}}

  /* invoice panel - the invoice itself, no QuickBooks login required */
  .ivbg{position:fixed; inset:0; z-index:150; background:rgba(26,29,26,0.42); display:none; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto;}
  .ivbg.show{display:flex;}
  .ivcard{width:min(720px,100%); background:var(--card); border-radius:var(--r-card); box-shadow:0 12px 44px rgba(0,0,0,0.22); overflow:hidden;}

  .ivhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:15px 18px; background:var(--green-tint-2); border-bottom:0.5px solid var(--green-border);}
  .ivtitle{font-size:15px; font-weight:600; color:var(--green-darker);}
  .ivsub{font-size:12px; color:var(--ink-2); margin-top:3px;}
  .ivclose{background:transparent; border:none; font-size:19px; color:var(--ink-3); cursor:pointer; line-height:1; padding:2px 5px; font-family:var(--font);}
  .ivclose:hover{color:var(--ink);}

  .ivbody{padding:14px 18px 18px; max-height:66vh; overflow-y:auto;}

  .ivsum{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:13px;}
  .ivstat{flex:1; min-width:96px; border:0.5px solid var(--line); border-radius:var(--r-pill); padding:8px 10px;}
  .ivstat-n{font-size:15px; font-weight:600;}
  .ivstat-l{font-size:10px; color:var(--ink-2); margin-top:1px;}

  .ivtable{width:100%; border-collapse:collapse; table-layout:auto;}
  .ivtable th{font-size:10.5px; font-weight:600; color:var(--ink-2); text-align:left; padding:6px 6px; border-bottom:0.5px solid var(--line-strong); white-space:nowrap; position:static; background:var(--card);}
  .ivtable td{padding:8px 6px; border-bottom:0.5px solid var(--line); font-size:12.5px; vertical-align:top; white-space:normal;}
  .ivtable tr.charge td{background:var(--red-tint);}
  .ivtable tr.header-line td{background:var(--panel); color:var(--ink-2); font-style:italic;}

  .ivkind{display:inline-block; font-size:10px; font-weight:600; padding:2px 7px; border-radius:var(--r-pill); white-space:nowrap;}
  .k-box{background:var(--green-tint); color:var(--green-darker);}
  .k-charge{background:var(--red-tint); color:var(--red-dark);}
  .k-header{background:var(--panel); color:var(--ink-3);}
  .ivwhy{font-size:10.5px; color:var(--red-dark); margin-top:2px;}

  .ivpaid{margin-top:13px; font-size:12px; color:var(--ink-2); background:var(--green-tint-2); border:0.5px solid var(--green-border); border-radius:var(--r-pill); padding:9px 12px;}
  .ivnote{margin-top:11px; font-size:11.5px; color:var(--ink-3); line-height:1.6;}

  /* billing draft */
  .bfilter{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .bchip{font-size:11px; font-family:var(--font); padding:4px 10px; border-radius:var(--r-pill); cursor:pointer;
         border:0.5px solid var(--green-border); background:var(--card); color:var(--green-dark); white-space:nowrap;}
  .bchip.on{background:var(--green); border-color:var(--green); color:#fff;}
  .bchip:hover:not(.on){background:var(--green-tint);}

  /* A billing row is an AGENT ROW. Not a card - the Agents page already
     solved "a row that opens to hold more", and inventing a second answer
     to the same question is what made this page look like it came from a
     different product. So .agrow / .aghead / .agdetail are reused whole,
     and only the columns are new.
     The flags reuse .chip too, which is what Receivables already speaks:
     a red chip means money that is late. */
  .bc-inv{width:56px; flex:0 0 56px; font-weight:600; color:var(--green-dark); font-size:12px;}
  .bc-mon{width:66px; flex:0 0 66px; font-size:11.5px; color:var(--ink-2); white-space:nowrap;}
  .bc-amt{width:104px; flex:0 0 104px; text-align:right; font-size:13px; font-weight:600; white-space:nowrap;}
  .bc-amt .bx{font-size:11px; font-weight:400; color:var(--ink-3);}
  .bc-del{width:56px; flex:0 0 56px; text-align:center;}
  .bc-flag{width:110px; flex:0 0 110px; text-align:right;}

  /* The QuickBooks name earns its place only when it differs from the one
     Kim actually says out loud. On one line now, not two - the row is a
     row. */
  .bname{font-size:13.5px; font-weight:600; flex:1 1 auto; min-width:0;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bname .dba{font-weight:400; font-size:11px; color:var(--ink-3); margin-left:7px;}

  /* Column labels. Sortable, like Receivables and Payments. */
  .bhead{display:flex; align-items:center; gap:10px; padding:7px 4px;
         border-bottom:0.5px solid var(--line-strong);
         font-size:10.5px; font-weight:600; color:var(--ink-2); white-space:nowrap;
         position:sticky; top:var(--pinh); background:var(--card); z-index:5;}
  /* The header reuses the row's column classes so the two line up exactly -
     but those classes carry the ROW's type sizes, which would render the
     labels at 13.5px. Pull them back to header type. */
  .bhead .bname, .bhead .bc-inv, .bhead .bc-amt, .bhead .bc-mon{
    font-size:10.5px; font-weight:600; color:var(--ink-2);}
  .bhead [data-bsort]{cursor:pointer;}
  .bhead [data-bsort]:hover{color:var(--ink);}

  /* Said once, in the panel, to the person who opened it - rather than
     shouted on every one of fifty rows. */
  .bwhy{font-size:11.5px; color:var(--ink-2); background:var(--panel);
        border:0.5px solid var(--line); border-radius:var(--r-ctl); padding:9px 12px;
        margin-bottom:10px; line-height:1.7;}
  .bwhy b{color:var(--ink); font-weight:600;}
  .bwhy.pay{background:var(--red-tint); border-color:var(--red); color:var(--red-darker);}
  .bwhy.pay b{color:var(--red-darker);}
  .bwhy.box{background:var(--amber-tint); border-color:var(--amber); color:var(--amber-dark);}
  .bwhy.box b{color:var(--amber-dark);}

  .bxline{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .bxline:last-child{margin-bottom:0;}
  /* The two fields are NOT the same kind of thing, so they do not look the
     same. One is written for the customer; the other is written about them. */
  .bxlbl{font-size:10.5px; flex:0 0 auto; white-space:nowrap; width:86px;}
  .bxlbl.out{color:var(--amber-dark); font-weight:600;}
  .bxlbl.in{color:var(--ink-3);}

  /* Delivery is its own thing - not a scrap buried in a note. */
  .bdeliv{font-size:10.5px; font-weight:600; border-radius:var(--r-pill); padding:2px 8px; white-space:nowrap;
          display:inline-block; text-decoration:none;}
  .d-email{background:var(--green-tint); color:var(--green-darker);}
  .d-portal{background:var(--amber-tint); color:var(--amber-dark);
            border:0.5px solid var(--amber); cursor:pointer;}
  .d-portal:hover{background:var(--amber); color:#fff;}
  .d-mail{background:var(--panel); color:var(--ink-2);}
  /* Notes get read - a URL or an instruction is useless truncated. They wrap. */
  .bnote{font-size:11.5px; color:var(--ink-2); line-height:1.5; white-space:normal; word-break:break-word;}

  /* Quarterly customers who aren't due. Said out loud, because a name simply
     missing from the list looks like a mistake. */
  .bskip{margin:0 0 8px; padding:9px 24px; display:flex; align-items:center; flex-wrap:wrap;
         gap:8px 11px; font-size:12px; background:none; border-radius:0;
         border-top:0.5px solid var(--line); border-bottom:0.5px solid var(--line);}
  .bskip-lead{display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--green-dark);}
  .bskip-lead svg{width:14px; height:14px; display:block;}
  .bskip-tag{display:inline-flex; align-items:center; gap:6px; border-radius:4px; padding:3px 9px;
             background:var(--green-tint); color:var(--green-darker); font-weight:600;}
  .bskip-tag .n{font-weight:400; color:var(--green-dark);}

  /* Editable, but only for the month being billed. A past month is a record
     and stays read-only. */
  .bedit{width:100%; font-family:var(--font); font-size:11.5px; color:var(--ink);
         background:var(--card); border:0.5px solid var(--line-strong); border-radius:var(--r-input);
         padding:5px 7px; outline:none; resize:vertical; min-height:30px; line-height:1.45;}
  .bedit:focus{border-color:var(--green); background:#fff;}
  .bedit.saving{border-color:var(--amber); background:var(--amber-tint);}
  .bedit.saved{border-color:var(--green); background:var(--green-tint-2);}

  /* The one-time fee - a replacement monitor, say - now lives in the row
     that opens, beside the note it almost always needs explaining. */
  .bfee{width:76px; font-family:var(--font); font-size:11.5px; text-align:right; color:var(--ink);
        background:var(--card); border:0.5px solid var(--line-strong); border-radius:var(--r-input);
        padding:4px 6px; outline:none; flex:0 0 auto;}
  .bfee:focus{border-color:var(--green); background:#fff;}
  .bfee.saved{border-color:var(--green); background:var(--green-tint-2);}
  .bfee.saving{border-color:var(--amber); background:var(--amber-tint);}

  /* What the fee IS. This text goes ON the customer's invoice, so it is
     tinted like the thing it is - outbound - rather than looking like the
     internal note sitting directly beneath it. */
  .bfdesc{flex:1; min-width:0; font-family:var(--font); font-size:11.5px; color:var(--ink);
          background:var(--card); border:0.5px solid var(--amber); border-radius:var(--r-input);
          padding:5px 7px; outline:none;}
  .bfdesc:focus{border-color:var(--amber-dark); background:#fff;}
  .bfdesc.saved{border-color:var(--green); background:var(--green-tint-2);}
  .bfdesc.saving{border-color:var(--amber); background:var(--amber-tint);}

  /* When a fee IS charged, the amount stops being one number and becomes a
     sum. Say so, under the total. */
  .bbase{font-size:10px; color:var(--green-dark); font-weight:600; text-align:right; margin-top:2px;}
  .binv{font-weight:600; color:var(--green-dark);}

  /* lock */
  .lock{position:fixed; inset:0; z-index:200; background:var(--page); display:flex; align-items:center; justify-content:center; padding:20px;}
  .lock.hide{display:none;}
  .lock-card{width:min(360px,100%); background:var(--card); border:0.5px solid var(--line-strong); border-radius:var(--r-card); padding:24px; text-align:center; box-shadow:0 3px 14px rgba(0,0,0,0.07);}
  .lock-brand{font-size:17px; font-weight:800; letter-spacing:0.04em; color:var(--green); margin-bottom:4px;}
  .lock-sub{font-size:13px; color:var(--ink-2); margin-bottom:16px;}
  .lock-in{width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line-strong); border-radius:var(--r-input); font-family:var(--font); color:var(--ink); outline:none;}
  .lock-in:focus{border-color:var(--green);}
  .lock-btn{width:100%; margin-top:12px; padding:11px; font-size:14px; font-weight:600; border-radius:var(--r-input); border:none; cursor:pointer; background:var(--green); color:#fff; font-family:var(--font);}
  .lock-err{margin-top:12px; padding:8px 10px; background:var(--red-tint); border:0.5px solid var(--red); border-radius:var(--r-input); color:var(--red-dark); font-size:12.5px; font-weight:600;}

  @media (max-width:560px){
    .search{width:104px;}
    /* Was th:nth-child(3),td:nth-child(3) - a positional rule that hit the
       third column of EVERY table on the page and would silently hide the
       wrong one if a column ever moved. Now named and scoped to the
       invoice table it was meant for. */
    .ivtable .iv-rate{display:none;}
    .score-n{font-size:15px;}
    .ftab{padding:6px 9px 7px; font-size:11px;}
  }

/* ---------- financials ---------- */

/* One card: legend, chart, cards, caveats. They are read together or not at
   all - a margin with no note about what is missing from it is a number
   pretending to be a conclusion. */
.fincard{ padding:18px 20px 16px; }

.finlegend{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  font-size:12px; color:var(--muted); margin-bottom:10px;
}

.sw-ces{  background:#1baf7a; }

.finyr{
  margin-left:auto; font-size:12px; padding:3px 6px;
  border:1px solid var(--line); border-radius:6px; background:#fff;
}

.finsvg{ width:100%; height:auto; display:block; }
.finband{ fill:rgba(30,60,30,0.045); }
.fingrid{ stroke:#e6e6df; stroke-width:1; }

/* A month CES has not been entered for. Hollow on purpose - it must read as
   a gap, never as a zero. */
.b-none{ fill:none; stroke:#c3c2b7; stroke-width:1; stroke-dasharray:2 2; }
.finline{ fill:none; stroke:#4a3aa7; stroke-width:2; stroke-linejoin:round; }

}

.finstory{ color:var(--ink,#2c2c2a); }

<style id="m-acct-css">
/* ===== mobile layer (<=860px): drawer rail + slide-in detail =====
   Mirrors the monitor dashboard's m-poc-css so both dashboards behave the
   same way on a phone. 860px matches the breakpoint already used by
   wn-shell, so there is no band where the old horizontal-strip rail and
   this drawer are both live. Desktop is untouched - everything here is
   inside the media query. */
.m-topbar,.m-backdrop,.m-back{display:none;}
@media(max-width:860px){
  /* wn-acct-rail sets padding-left:280px with !important, which the
     non-important reset in wn-shell could never beat - so on a phone the
     page carried 280px of dead left padding. This is the fix. */
  body{padding-left:0 !important; padding-top:52px !important;}

  .m-topbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;
    height:52px;background:#153a22;z-index:80;padding:0 12px;box-shadow:0 1px 6px rgba(0,0,0,.22);}
  .m-burger{background:none;border:none;color:#eaf3de;font-size:23px;line-height:1;cursor:pointer;padding:4px 8px;}
  .m-title{color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em;}

  /* rail becomes a slide-in drawer rather than a horizontal strip */
  body .wn-rail{position:fixed !important;left:0;top:0;bottom:0;width:272px !important;height:auto !important;
    flex-direction:column !important;align-items:stretch !important;transform:translateX(-100%);
    transition:transform .26s ease;z-index:90;overflow-y:auto !important;overflow-x:hidden !important;}
  .wn-rail.m-open{transform:translateX(0);}
  body .wn-rail__brand{flex-direction:column !important;align-items:center !important;
    padding:18px 16px 14px !important;border-bottom:1px solid #265c39 !important;gap:10px !important;}
  body .wn-rail__brand img{width:132px !important;margin:0 auto !important;}
  body .wn-rail__sections{display:flex !important;flex-direction:column !important;}
  body .wn-rail__menu{width:100% !important;}

  .m-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;opacity:0;
    pointer-events:none;transition:opacity .26s;}
  .m-backdrop.m-open{display:block;opacity:1;pointer-events:auto;}

  /* --- the split collapses everywhere, not just on Receivables --- */
  .ag-topbar{grid-template-columns:1fr !important;position:static !important;}
  .ag-hd-detail{display:none !important;}
  .ag-split{grid-template-columns:1fr !important;gap:0 !important;}
  .ag-list-col{border-right:none !important;padding-left:14px !important;padding-right:14px !important;}
  /* The desktop page paints a hard 50/50 gradient to sit behind the two
     columns. With one column there is nothing on top of the green half, so
     it shows through as bare background under the list. Flat grey instead -
     the slide-in panel brings its own green when it arrives. */
  .wrap, .wrap:has(.ag-split){background:var(--list-bg) !important;}
  .ag-hd-list{border-right:none !important;}

  /* sticky headers unstick - stacked on a phone they only eat vertical space */
  .rc-head{position:static !important;top:auto !important;}
  .rc-folder .pinhead,.bill-folder .pinhead{position:static !important;top:auto !important;}
  .bill-folder .bhead{position:static !important;top:auto !important;}
  .ag-list-col .bhead{padding-left:14px !important;padding-right:14px !important;}

  /* Detail treatment splits two ways.
     SLIDE-IN for the row-driven sections (Agents, Receivables, Payments,
     Billing): tapping a row should bring its detail over the page rather
     than stack it below the list. */
  .ag-folder .ag-detail,
  .rc-folder:not(.dz-folder) .ag-detail,
  .bill-folder .ag-detail{
    position:fixed !important;inset:52px 0 0 0 !important;max-height:none !important;
    height:auto !important;overflow-y:auto !important;background:var(--sel,#E7F1D8) !important;
    z-index:75;transform:translateX(100%);transition:transform .26s ease;
    padding:52px 14px 44px !important;border:none !important;border-radius:0 !important;}
  body.m-detail .ag-folder .ag-detail,
  body.m-detail .rc-folder:not(.dz-folder) .ag-detail,
  body.m-detail .bill-folder .ag-detail{transform:translateX(0);}
  body.m-detail .m-back{display:inline-flex;align-items:center;gap:5px;position:fixed;top:60px;left:12px;
    z-index:78;background:#fff;color:#1A1D1A;border:1px solid #dde1dd;border-radius:9px;
    padding:8px 13px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:pointer;}

  /* Agents is the ONE section whose .ag-hd-detail carries actions rather than
     just a title - the agent name, the address with its edit link, and the
     Email Statement button. Hiding it (as the other sections can afford to)
     took the send button away. It is repositioned as a fixed strip that
     slides with the panel instead. The ORIGINAL node is moved, never cloned:
     [data-emailstmt] is wired with .onclick after each render, so a copy
     would render a button that does nothing. */
  .ag-folder .ag-hd-detail{
    display:block !important;position:fixed !important;top:52px;left:0;right:0;z-index:76;
    background:#fff !important;border-bottom:1px solid var(--line) !important;
    /* Left gap clears the floating Back button. Its width is measured at
       runtime (--m-back-w) rather than guessed - a hardcoded 112px was
       narrower than the button actually renders, so it sat on top of the
       agent's name. */
    padding:9px 14px 11px calc(var(--m-back-w, 124px) + 20px) !important;
    transform:translateX(100%);transition:transform .26s ease;}
  body.m-detail .ag-folder .ag-hd-detail{transform:translateX(0);}
  .ag-folder .ag-hd-drow{display:flex !important;align-items:center !important;gap:10px !important;
    justify-content:space-between !important;}
  .ag-folder .ag-hd-detail .ag-hd-title{font-size:14px !important;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .ag-folder .ag-hd-email{display:flex !important;align-items:center;gap:8px;margin-top:3px;
    font-size:11.5px;min-width:0;}
  .ag-folder .ag-hd-em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  /* Panel clears the strip. The height is measured at runtime (m-acct-js)
     because the agent name and address can wrap; the fallback covers the
     first paint before that measurement lands. */
  body.m-detail .ag-folder .ag-detail{padding-top:calc(var(--m-dhead-h, 86px) + 14px) !important;}

  /* STACKED for the always-on panes (Financials, Deposits). Their detail is
     a notes card, not a per-row drill-in, so it follows the list down. */
  .folder:not(.rc-folder):not(.bill-folder):not(.ag-folder) .ag-detail,
  .dz-folder .ag-detail{
    position:static !important;top:auto !important;max-height:none !important;
    overflow-y:visible !important;padding:16px 14px 32px !important;}
  /* ...and its green runs to the bottom of the screen rather than stopping
     at the card. .wrap is min-height:100vh, so a short pane left grey showing
     underneath. Two rows - list sized to content, detail taking the rest -
     with the split guaranteed at least a viewport tall (less the fixed
     topbar). When the content is already taller than that, 1fr resolves to
     the content height and this changes nothing. */
  .folder:not(.rc-folder):not(.bill-folder):not(.ag-folder) .ag-split,
  .dz-folder .ag-split{
    grid-template-rows:auto 1fr !important;
    min-height:calc(100vh - 52px) !important;
    align-items:stretch !important;}

  /* ---- Receivables & Payments: two-line rows ----
     Both rows are a flat .aghead flex container of sibling spans, so this is
     wrap + order only. No markup changes, which is what keeps the sort
     wiring, the row click and the invoice selection working untouched.
     The header (.rc-head) shares the cell class names, so it reflows into
     the same two-line shape and stays a label for the values beneath it. */
  .rc-folder:not(.dz-folder) .aghead,
  .rc-folder:not(.dz-folder) .rc-head{
    flex-wrap:wrap !important;white-space:normal !important;align-items:center !important;
    padding-left:14px !important;padding-right:14px !important;
    row-gap:3px !important;column-gap:8px !important;}
  .rc-folder:not(.dz-folder) .aghead{padding-top:11px !important;padding-bottom:11px !important;}
  /* Zero-height full-width spacer at order:3 forces the break - everything
     ordered after it lands on line two. */
  .rc-folder:not(.dz-folder) .aghead::after,
  .rc-folder:not(.dz-folder) .rc-head::after{
    content:"";flex:0 0 100% !important;height:0;order:3;}

  /* Receivables - customer + balance lead, invoice/due/age beneath */
  .rc-folder:not(.pm-folder):not(.dz-folder) .rc-cust{
    order:1;flex:1 1 auto !important;min-width:0;white-space:normal !important;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px !important;line-height:1.3;}
  .rc-folder:not(.pm-folder):not(.dz-folder) .rc-bal{
    order:2;flex:0 0 auto !important;width:auto !important;font-size:14px !important;}
  .rc-folder:not(.pm-folder):not(.dz-folder) .rc-inv{
    order:4;flex:0 0 auto !important;width:auto !important;font-size:11.5px !important;}
  .rc-folder:not(.pm-folder):not(.dz-folder) .rc-due{
    order:5;flex:0 0 auto !important;width:auto !important;font-size:11.5px !important;}
  .rc-folder:not(.pm-folder):not(.dz-folder) .rc-age{
    order:6;flex:0 0 auto !important;width:auto !important;margin-left:auto;text-align:right;}

  /* Payments - customer + amount lead, date/invoice beneath */
  .pm-folder .pm-cust{
    order:1;flex:1 1 auto !important;min-width:0;white-space:normal !important;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px !important;line-height:1.3;}
  .pm-folder .pm-amt{
    order:2;flex:0 0 auto !important;width:auto !important;font-size:14px !important;}
  .pm-folder .pm-date{
    order:4;flex:0 0 auto !important;width:auto !important;font-size:11.5px !important;}
  .pm-folder .pm-inv{
    order:5;flex:0 0 auto !important;width:auto !important;margin-left:auto;text-align:right;}

  /* The rules above are specific enough to beat the header's own font sizing,
     which would have blown the labels up to row size. Put back. The child
     selector spares the nested .sc sort carets. */
  .rc-folder:not(.dz-folder) .rc-head > span{
    font-size:10.5px !important;line-height:1.4;
    -webkit-line-clamp:none !important;display:inline-block !important;}

  /* ---- Billing: same two-line treatment ----
     The row demanded ~444px of fixed cells, gaps and padding on a ~380px
     screen. .bc-flag is last in source order, so the flags were what ran off
     the right edge. Rows are .aghead (with a leading .agcaret), the header is
     .bhead - both flat flex, so the same wrap + order approach applies. */
  .bill-folder .aghead,
  .bill-folder .bhead{
    flex-wrap:wrap !important;white-space:normal !important;align-items:center !important;
    padding-left:14px !important;padding-right:14px !important;
    row-gap:3px !important;column-gap:8px !important;}
  .bill-folder .aghead{padding-top:11px !important;padding-bottom:11px !important;}
  .bill-folder .aghead::after,
  .bill-folder .bhead::after{content:"";flex:0 0 100% !important;height:0;order:3;}

  .bill-folder .agcaret{order:0;flex:0 0 auto !important;}
  .bill-folder .bname{
    order:1;flex:1 1 auto !important;min-width:0;white-space:normal !important;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px !important;line-height:1.3;}
  .bill-folder .bc-amt{
    order:2;flex:0 0 auto !important;width:auto !important;font-size:14px !important;}
  .bill-folder .bc-inv{
    order:4;flex:0 0 auto !important;width:auto !important;font-size:11.5px !important;}
  .bill-folder .bc-mon{
    order:5;flex:0 0 auto !important;width:auto !important;font-size:11.5px !important;}
  .bill-folder .bc-del{
    order:6;flex:0 0 auto !important;width:auto !important;text-align:left !important;}
  /* Flags sit hard right on line two and are allowed to wrap among
     themselves rather than push the row wider. */
  .bill-folder .bc-flag{
    order:7;flex:0 1 auto !important;width:auto !important;min-width:0;
    margin-left:auto;text-align:right;white-space:normal !important;}
  .bill-folder .bhead > span{
    font-size:10.5px !important;line-height:1.4;
    -webkit-line-clamp:none !important;display:inline-block !important;}

  /* ---- stop the focus zoom ----
     iOS Safari zooms the viewport whenever a focused control computes below
     16px, which is why tapping the quantity box threw the rest of the detail
     off-screen. Sizing the controls at 16px fixes it at the source; the
     alternative (user-scalable=no on the viewport meta) would disable
     pinch-zoom for the whole page, which is a worse trade. */
  input[type="text"], input[type="number"], input[type="password"],
  input[type="search"], input[type="email"], input:not([type]),
  textarea, select{font-size:16px !important;}
  /* room for the larger digits in the fee box, and let the search control
     grow to fit rather than clipping its own text */
  .bfee{width:92px !important;}
  .search, .bsearch-hd{height:auto !important;min-height:var(--h-ctl);padding:6px 10px !important;}

  /* modals: let the footer wrap so the send button can't land off-screen */
  .ivbg{padding:16px 10px !important;}
  .stmt-foot{flex-wrap:wrap !important;}
  .stmt-subj{flex:1 1 100% !important;white-space:normal !important;}
  .fincards{padding-left:0 !important;padding-right:0 !important;}
}
/* The invoice table can exceed a phone's width; let its container scroll
   sideways rather than forcing the whole page wide. */
.ivbody{overflow-x:auto;}
.ag-detail{overflow-x:auto;}
</style>
</head>
