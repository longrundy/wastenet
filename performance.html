<!DOCTYPE html>
<!-- wastenet box performance · build 2026-07-21-a · rail split into Fullness + Weight Performance; weight-coverage rows and detail card -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WasteNet — Box Performance</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  :root{
    --green:#5CAA16; --green-dark:#3B6D11; --green-darker:#27500A;
    --green-tint:#EAF3DE; --green-tint-2:#F4FAEC; --green-border:#C0DD97;
    --amber:#EF9F27; --amber-dark:#854F0B;
    --red:#E24B4A; --red-dark:#A32D2D; --red-darker:#791F1F; --red-tint:#FCEBEB;
    --ink:#1A1D1A; --ink-2:#525A60; --ink-3:#8A8F8A;
    --line:#E4E7E0; --line-strong:#CFD4CA;
    --card:#FFFFFF; --panel:#F6F7F3; --page:#FAFBF8;
    --r-input:6px; --r-ctl:8px; --r-menu:10px; --r-card:12px; --r-pill:999px; --h-ctl:30px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{font-family:var(--font); background:var(--page); color:var(--ink); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px; margin:0 auto; padding:20px 16px 80px;}
  .topcard{border:0.5px solid var(--line); border-radius:var(--r-card); background:var(--card); padding:12px 16px 15px;}
  .header{display:flex; align-items:center; gap:10px;}
  .perf-sticky{position:sticky; top:0; z-index:50; background:var(--page); margin-bottom:12px;}
  .perf-sticky .topcard{margin-bottom:14px;}
  .header-left{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block; flex:0 0 auto;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-2);}
  .spinner{display:inline-block; width:16px; height:16px; background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNzkgMjA2Ij48ZyBmaWxsPSIjNUNBQTE2Ij48cGF0aCBkPSJNMCAwIEMyLjggMC4zIDMuOCAwLjggNS43IDMuMCBDNi4yIDMuOSA2LjggNC44IDcuNCA1LjcgQzguMCA2LjcgOC42IDcuNiA5LjIgOC43IEM5LjkgOS43IDEwLjUgMTAuOCAxMS4yIDExLjkgQzExLjkgMTMuMCAxMi41IDE0LjAgMTMuMiAxNS4yIEMxOC45IDI0LjUgMjMuNyAzNC4wIDI4IDQ0IEMyOC4zIDQ0LjcgMjguNiA0NS4zIDI4LjkgNDYuMCBDMzMuMiA1NS43IDM1LjggNjUuNiAzOCA3NiBDMzguMiA3Ni44IDM4LjQgNzcuNSAzOC41IDc4LjMgQzQzLjAgMTA0LjEgMzYuOSAxMjguMiAyMi44IDE0OS44IEMxMi40IDE2NC4wIC0xLjEgMTc0LjQgLTE2LjEgMTgzLjIgQy0yMi43IDE4Ny4yIC0yNi43IDE5MS40IC0yOSAxOTkgQy0yOS40IDIwMS4zIC0yOS43IDIwMy43IC0zMCAyMDYgQy0zNC42IDIwNiAtMzkuMiAyMDYgLTQ0IDIwNiBDLTQ0LjUgMTk1LjcgLTQzLjYgMTg5LjIgLTM5IDE4MCBDLTM4LjIgMTc4LjQgLTM3LjUgMTc2LjcgLTM2LjcgMTc1LjEgQy0zMy4wIDE2Ny4yIC0yOS4zIDE1OS40IC0yNS4xIDE1MS43IEMtMTIuOSAxMjkuMyAtNC4wIDEwNy4zIC0xIDgyIEMtMS4xIDgyLjMgLTEuMSA4Mi4zIC0xLjUgODMuNiBDLTYuNyA5OS40IC0xMi43IDExNC41IC0yMC45IDEyOS4wIEMtMjEuOSAxMzAuOCAtMjIuOCAxMzIuNiAtMjMuOCAxMzQuNCBDLTI0LjAgMTM0LjggLTI0LjAgMTM0LjggLTI1LjMgMTM3LjEgQy0yNS43IDEzNy45IC0yNi4xIDEzOC42IC0yNi42IDEzOS40IEMtMjguNSAxNDEuNiAtMzAuMiAxNDEuNyAtMzMgMTQyIEMtMzUuMyAxMzguNiAtMzUuNSAxMzYuMyAtMzYuMiAxMzIuMyBDLTM4LjQgMTIwLjMgLTQzLjMgMTA5LjUgLTUwLjcgOTkuOCBDLTUyIDk4IC01MiA5OCAtNTIgOTYgQy01Mi43IDk2IC01My4zIDk2IC01NCA5NiBDLTU1LjUgOTQuMyAtNTYuOSA5Mi42IC01OC4zIDkwLjggQy02MS40IDg3LjAgLTY0LjUgODMuNCAtNjggODAgQy02Ny4zIDc4LjMgLTY2LjcgNzYuNyAtNjYgNzUgQy02NS4zIDc1IC02NC43IDc1IC02NCA3NSBDLTYzLjggNzQuNSAtNjMuNSA3My45IC02My4zIDczLjQgQy02MC4zIDY3LjkgLTU1LjAgNjEuMCAtNDkgNTkgQy00OC4zIDU3LjcgLTQ3LjYgNTYuMyAtNDcgNTUgQy00NS42IDUzLjQgLTQ1LjYgNTMuNCAtNDQuMCA1MS44IEMtNDMuNCA1MS4yIC00Mi44IDUwLjcgLTQyLjIgNTAuMSBDLTQxLjYgNDkuNSAtNDEuMCA0OC45IC00MC4zIDQ4LjIgQy0zNC40IDQyLjQgLTI4LjggMzYuNiAtMjMuNyAzMCBDLTIzLjEgMjkuMyAtMjIuNiAyOC43IC0yMiAyOCBDLTIxLjMgMjggLTIwLjcgMjggLTIwIDI4IEMtMTkuOCAyNy41IC0xOS42IDI3LjAgLTE5LjMgMjYuNCBDLTE3LjUgMjMu   @keyframes spin{to{transform:rotate(360deg);}}

  .lock{position:fixed; inset:0; z-index:100; background:var(--page); display:flex; align-items:center; justify-content:center; padding:20px;}
  .lock-card{width:min(360px,100%); background:var(--card); border:0.5px solid var(--line-strong); border-radius:var(--r-card); padding:24px; text-align:center; box-shadow:0 3px 14px rgba(0,0,0,0.07);}
  .lock-sub{font-size:13px; color:var(--ink-2); margin-bottom:16px;}
  .lock-in{width:100%; box-sizing:border-box; padding:10px 12px; font-size:15px; border:1px solid var(--line-strong); border-radius:var(--r-input); font-family:var(--font); color:var(--ink); outline:none;}
  .lock-in:focus{border-color:var(--green);}
  .lock-btn{width:100%; margin-top:12px; padding:11px; font-size:14px; font-weight:600; border-radius:var(--r-input); border:none; cursor:pointer; background:var(--green); color:#fff; font-family:var(--font);}
  .lock-err{margin-top:12px; padding:8px 10px; background:var(--red-tint); border:0.5px solid var(--red); border-radius:var(--r-input); color:var(--red-dark); font-size:12.5px; font-weight:600;}

  .perf-title{display:flex; align-items:baseline; gap:12px; margin-bottom:14px;}
  .perf-title h1{font-size:18px; font-weight:600; margin:0;}
  .perf-sub{font-size:12.5px; color:var(--ink-3);}

  .tier-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding-bottom:12px;}
  .tier-btn{cursor:pointer; text-align:left; background:var(--panel); border:0.5px solid var(--line); border-radius:var(--r-card); padding:10px 12px; font-family:var(--font); transition:background .12s, border-color .12s, padding .14s;}
  .tier-btn:hover{background:#fff;}
  .tier-btn.on{background:#fff;}
  .tier-bat{margin-bottom:6px; height:20px;}
  .tier-bat svg{transition:width .14s, height .14s;}
  .tier-name{font-size:15px; font-weight:600; color:var(--ink);}
  .tier-btn.on .tier-name{color:var(--btnc);}
  .tier-n{font-size:11.5px; color:var(--ink-2); margin-top:1px;}
  @media (max-width:640px){ .tier-btns{grid-template-columns:repeat(2,1fr);} }

  /* Slim state: once you scroll into the list, the title collapses and the four
     buttons compress to a single-line, smaller-battery form so they stay in
     reach without taking up the screen. */
  .perf-sticky.slim .perf-title{display:none;}
  .perf-sticky.slim .topcard{margin-bottom:10px;}
  .perf-sticky.slim .tier-btn{padding:6px 11px; display:flex; align-items:center; gap:9px;}
  .perf-sticky.slim .tier-bat{margin:0; height:15px;}
  .perf-sticky.slim .tier-bat svg{width:28px; height:14px;}
  .perf-sticky.slim .tier-name{font-size:12.5px;}
  .perf-sticky.slim .tier-n{margin:0 0 0 auto; font-size:11px;}

  .tier-note{font-size:11.5px; color:var(--ink-3); margin-bottom:10px;}
  .tier-list{background:none; border:none; border-top:0.5px solid var(--line); border-bottom:0.5px solid var(--line); border-radius:0; overflow:visible; margin:0 -22px;}
  .prow{display:grid; grid-template-columns:52px 1fr 104px 56px 44px auto; align-items:center; gap:10px; padding:9px 22px; border-top:0.5px solid var(--line); font-size:12.5px;}
  .prow:first-child{border-top:none;}
  .prow .pid{color:var(--ink-3);}
  .prow .psite{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prow .pcad{color:var(--ink-2);}
  .prow .pw{color:#c9c9c1;}
  .bar{display:inline-block; width:56px; height:6px; background:#EDEDE7; border-radius:3px; vertical-align:middle; overflow:hidden;}
  .bar > span{display:block; height:6px;}
  .pavg{font-weight:600; margin-left:5px;}
  .flag{font-size:10.5px; padding:2px 7px; border-radius:5px; white-space:nowrap;}
  .flag-bridging{background:#FAEEDA; color:var(--amber-dark);}
  .flag-hauler-set{background:#F1EFE8; color:var(--ink-2);}
  .tier-foot{padding:8px 22px; border-top:0.5px solid var(--line); font-size:11.5px; color:#a7a7a0;}
  .perf-meta{margin-top:12px; font-size:11.5px; color:var(--ink-3);}
  .prow.wt{grid-template-columns:32px 52px 1fr 96px 74px 40px auto;}
  .prow.wt .pid{border-left:1px solid var(--line);padding-left:11px;}
  .wmail{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--ink-3);}
  .wmail:hover{background:var(--green-tint);color:var(--green-dark);}
  .wmail svg{width:16px;height:16px;display:block;}
  .cmp-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(20,30,25,0.45);}
  .cmp-overlay.show{display:flex;}
  .cmp-overlay iframe{width:min(1240px,96vw);height:94vh;border:none;border-radius:12px;background:var(--page);box-shadow:0 20px 60px rgba(20,30,25,0.32);}

  /* ---- batch weights selection surface ---- */
  .batch-start{cursor:pointer;display:inline-flex;align-items:center;gap:7px;border:0.5px solid var(--green-border);background:var(--green-tint);color:var(--green-darker);font-weight:600;font-size:12.5px;border-radius:var(--r-ctl);padding:7px 13px;margin-bottom:12px;font-family:var(--font);}
  .batch-start:hover{background:#E1EFCF;}
  .batch-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .batch-bar .bsel{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;}
  .batch-bar .bcount{font-size:12.5px;color:var(--ink-2);}
  .batch-bar .bspacer{flex:1 1 auto;}
  .batch-btn{cursor:pointer;border:0.5px solid var(--green);background:var(--green);color:#fff;font-weight:600;font-size:12.5px;border-radius:var(--r-ctl);padding:7px 13px;font-family:var(--font);}
  .batch-btn:hover{background:#4f9412;}
  .batch-btn:disabled{opacity:.45;cursor:default;}
  .batch-btn.ghost{background:#fff;color:var(--ink-2);border-color:var(--line-strong);}
  .batch-btn.ghost:hover{background:var(--panel);}
  .brow{display:grid;grid-template-columns:24px 50px 1fr 84px 66px;align-items:center;gap:10px;padding:8px 22px;border-top:0.5px solid var(--line);font-size:12.5px;}
  .brow:first-child{border-top:none;}
  .brow.dis{opacity:.6;}
  .brow input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer;margin:0;}
  .brow .bid{color:var(--ink-3);}
  .brow .bsite{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brow .bcov{color:var(--ink-2);text-align:right;}
  .bchip{font-size:10px;padding:2px 7px;border-radius:5px;white-space:nowrap;justify-self:start;}
  .bchip.never{background:var(--red-tint);color:var(--red-dark);}
  .bchip.rarely{background:#FAEEDA;color:var(--amber-dark);}
  .bneed{font-size:10.5px;color:var(--ink-3);white-space:nowrap;}
  .batch-foot{padding:9px 22px;border-top:0.5px solid var(--line);font-size:11.5px;color:var(--ink-3);}
</style>

<style id="wn-shell">
/* ===== WasteNet brand shell — visual layer only, no app logic touched ===== */
.wn-rail{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:45;background:#153a22;
  color:#c9d6cd;display:flex;flex-direction:column;overflow-y:auto;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wn-rail__brand{padding:22px 18px 18px;border-bottom:1px solid #265c39;display:flex;
  flex-direction:column;gap:10px;align-items:center;text-align:center;}
.wn-rail__brand img{width:150px;height:auto;display:block;margin:0 auto;}
.wn-rail__sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7ea589;}
.wn-rail__nav{padding:12px;flex:1;}
.wn-rail__h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5d8168;padding:10px 8px 8px;}
.wn-rail__sections .rail-h{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e3f1e7;padding:8px 12px 7px;}
.wn-rail__sections .rail-h.is-divider{margin-top:16px;padding-top:16px;border-top:1px solid #2f6f45;}
.wn-rail__link{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:8px;
  font-size:13.5px;color:#c1d3c6;text-decoration:none;border-left:2px solid transparent;margin-bottom:2px;}
.wn-rail__link:hover{background:#1c4a2c;color:#fff;}
.wn-rail__link.is-active{background:#1c4a2c;color:#fff;border-left-color:#5CAA16;font-weight:600;}
.wn-rail__link .i{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#8fbf9c;}
.wn-rail__link:hover .i,.wn-rail__link.is-active .i{color:#fff;}
.wn-rail__link .i svg{width:18px;height:18px;display:block;}
.wn-rail__foot{padding:14px 18px;border-top:1px solid #265c39;font-size:11px;color:#6f9179;text-align:center;}
body{padding-left:236px;}
.wrap{max-width:1160px;}
.wn-lock-logo{width:172px;height:auto;display:block;margin:0 auto 12px;}

@media(max-width:860px){
  body{padding-left:0;}
  .wn-rail{position:static;width:auto;height:auto;flex-direction:row;align-items:center;overflow:visible;}
  .wn-rail__brand{border-bottom:none;flex-direction:row;align-items:center;padding:10px 14px;gap:8px;}
  .wn-rail__brand img{width:118px;}
  .wn-rail__sub,.wn-rail__h,.wn-rail__foot{display:none;}
  .wn-rail__nav{display:flex;gap:2px;padding:8px;overflow-x:auto;flex:1;}
  .wn-rail__link{white-space:nowrap;margin-bottom:0;}
  .wrap{max-width:100%;}
  .slimbar{left:0!important;}
}
</style>
<style id="wn-perf3">
.perf-split{display:grid;grid-template-columns:1fr 372px;gap:16px;align-items:start;}
.prow{cursor:pointer;}
.prow:hover{background:var(--panel);}
.prow.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--green);}
.perf-detail{position:sticky;top:12px;background:var(--card);border:0.5px solid var(--line);border-radius:var(--r-card);overflow:hidden;min-height:220px;}
.pd-empty{padding:52px 24px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.5;}
.pd-head{padding:20px 20px 16px;border-bottom:0.5px solid var(--line);}
.pd-tag{display:inline-flex;font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);letter-spacing:.02em;}
.pd-head h3{font-size:23px;margin:11px 0 2px;font-weight:700;}
.pd-sub{font-size:13px;color:var(--ink-2);}
.pd-gauge{padding:20px;text-align:center;border-bottom:0.5px solid var(--line);}
.pd-big{font-size:42px;font-weight:700;line-height:1;letter-spacing:-.02em;}
.pd-big span{font-size:20px;}
.pd-cap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;}
.pd-track{height:8px;background:#EDEDE7;border-radius:5px;margin-top:13px;overflow:hidden;}
.pd-track span{display:block;height:8px;border-radius:5px;}
.pd-facts{display:grid;grid-template-columns:1fr 1fr;gap:0.5px;background:var(--line);}
.pd-facts>div{background:var(--card);padding:12px 16px;}
.pd-fl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
.pd-fv{font-size:14px;font-weight:600;margin-top:3px;}
.pd-insight{padding:16px 18px;font-size:12.5px;line-height:1.55;color:var(--ink-2);}
.pd-insight b{color:var(--ink);}
.pd-recent{border-top:0.5px solid var(--line);}
.pd-recent-h{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:14px 18px 4px;}
.pd-hrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:6px 18px;font-size:12.5px;border-top:0.5px solid var(--line);}
.pd-hrow .hd{color:var(--ink-2);}
.pd-hrow .hp{color:var(--ink-3);min-width:38px;text-align:right;}
.pd-hrow .hw{font-weight:600;min-width:54px;text-align:right;}
.pd-hrow .hw.none{color:#c3c3bb;font-weight:400;}
.pd-hrow-h{border-top:none;padding-top:2px;padding-bottom:2px;}
.pd-hrow-h span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;}
@media(max-width:900px){.perf-split{grid-template-columns:1fr;}.perf-detail{position:static;}}
</style>
<style id="perf-console-css">
:root{--list-bg:#F3F5F1;--sel:#E7F1D8;}
.wn-rail{width:280px !important;overflow-x:hidden;}
body{padding-left:280px !important;}
.wn-rail__menu{width:100%;margin-top:14px;}
.wn-rail .wn-nav{display:block;width:100%;position:relative;}
.wn-rail .wn-trigger{width:100%;justify-content:space-between;background:rgba(255,255,255,0.08);border-color:#2f5d40;color:#eaf3de;height:38px;font-size:13px;}
.wn-rail .wn-trigger:hover{background:rgba(255,255,255,0.14);border-color:#3f7050;}
.wn-rail .wn-trigger.wn-open{background:rgba(92,170,22,0.18);border-color:#5CAA16;color:#fff;}
.wn-rail .wn-caret{color:#9fc0a8;}
.wn-rail .wn-drop{left:0;right:0;min-width:0;width:auto;z-index:200;box-sizing:border-box;}
.wn-rail__sections{padding:10px 12px;display:flex;flex-direction:column;gap:2px;margin-top:12px;flex:1;overflow-y:auto;}
.wn-rail__sections .sec{display:block;width:100%;text-align:left;background:none;border:none;border-radius:8px;cursor:pointer;padding:10px 12px;color:#c1d3c6;font-family:inherit;font-size:13.5px;font-weight:500;border-left:2px solid transparent;}
.wn-rail__sections .sec:hover{background:#1c4a2c;color:#fff;}
.wn-rail__sections .sec.on{background:#1c4a2c;color:#fff;border-left-color:#5CAA16;font-weight:600;}
.wn-rail__sections .sec .n{float:right;opacity:.55;font-weight:500;}
.wn-rail__sections .sec .sec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:middle;flex:0 0 auto;}
#app.wrap{max-width:none !important;margin:0 !important;padding:0 !important;min-height:100vh;background:linear-gradient(to right,var(--list-bg) 0,var(--list-bg) 50%,var(--sel) 50%,var(--sel) 100%);}
.ag-topbar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr 1fr;background:#fff;}
.ag-hd{height:64px;padding:10px 24px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden;}
.ag-hd-list{background:var(--list-bg);border-right:1px solid var(--line);}
.ag-hd-detail{background:var(--sel);}
.ag-hd-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#153a22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-hd-sub{font-size:12px;color:#5CAA16;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-split{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;}
.ag-list-col{background:var(--list-bg);border-right:1px solid var(--line);min-width:0;padding:18px 22px 44px;}
.ag-detail{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow-y:auto;background:var(--sel);padding:18px 22px 44px;}
.rc-iv-card{background:#fff;border:0.5px solid var(--line);border-radius:12px;box-shadow:0 2px 14px rgba(20,40,20,.10);margin:0 auto;overflow:hidden;max-width:480px;}
.perf-portfolio{font-size:11.5px;color:var(--ink-3);margin-bottom:10px;}
@media(max-width:820px){
  #app.wrap{background:var(--list-bg);}
  .ag-topbar{grid-template-columns:1fr;} .ag-hd-detail{display:none;}
  .ag-split{grid-template-columns:1fr;} .ag-list-col{border-right:none;}
  .ag-detail{position:static;max-height:none;top:auto;}
}
</style>
<style id="m-pf-css">
/* ===== mobile layer (<=860px): drawer rail + slide-in detail =====
   Matches the monitor, accounting and contacts pages. One breakpoint: the
   rail previously switched at 860px while the layout switched at 820px,
   leaving a 40px band with a horizontal strip above a two-column split.
   These rules carry !important so they beat the 820px block above. */
.m-topbar,.m-backdrop,.m-back{display:none;}
@media(max-width:860px){
  /* perf-console-css sets padding-left:280px with !important, which the
     non-important reset in wn-shell could never beat - so a phone carried
     280px of dead left padding on a ~380px screen. */
  body{padding-left:0 !important; padding-top:52px !important;}

  .m-topbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;
    height:52px;background:#153a22;z-index:80;padding:0 12px;box-shadow:0 1px 6px rgba(0,0,0,.22);}
  .m-burger{background:none;border:none;color:#eaf3de;font-size:23px;line-height:1;cursor:pointer;padding:4px 8px;}
  .m-title{color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em;}

  body .wn-rail{position:fixed !important;left:0;top:0;bottom:0;width:272px !important;height:auto !important;
    flex-direction:column !important;align-items:stretch !important;transform:translateX(-100%);
    transition:transform .26s ease;z-index:90;overflow-y:auto !important;overflow-x:hidden !important;}
  .wn-rail.m-open{transform:translateX(0);}
  body .wn-rail__brand{flex-direction:column !important;align-items:center !important;
    padding:18px 16px 14px !important;border-bottom:1px solid #265c39 !important;gap:10px !important;}
  body .wn-rail__brand img{width:132px !important;margin:0 auto !important;}
  body .wn-rail__menu{width:100% !important;}
  body .wn-rail__sections{display:flex !important;flex-direction:column !important;}

  .m-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;opacity:0;
    pointer-events:none;transition:opacity .26s;}
  .m-backdrop.m-open{display:block;opacity:1;pointer-events:auto;}

  /* single column */
  #app.wrap{background:var(--list-bg) !important;}
  .ag-topbar{grid-template-columns:1fr !important;position:static !important;}
  .ag-hd-detail{display:none !important;}
  .ag-hd-list{border-right:none !important;}
  .ag-split{grid-template-columns:1fr !important;}
  .ag-list-col{border-right:none !important;}

  /* Detail slides in - a long tier list with a per-row drill-in. */
  #greenCol.ag-detail{
    position:fixed !important;inset:52px 0 0 0 !important;max-height:none !important;
    height:auto !important;overflow-y:auto !important;overflow-x:auto;background:var(--sel,#E7F1D8) !important;
    z-index:75;transform:translateX(100%);transition:transform .26s ease;
    padding:0 14px 44px !important;border:none !important;border-radius:0 !important;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;}
  body.m-detail #greenCol.ag-detail{transform:translateX(0);}
  body.m-detail{overflow:hidden !important;}

  /* Two independent guarantees, because they failed separately before.
     1) THE CONTROL ALWAYS EXISTS. The Back bar is a fixed, body-level
        element. renderDetail rewrites the pane's innerHTML constantly, so
        anything living inside the pane can be thrown out; at body level it
        cannot be. */
  .m-backbar{display:none;position:fixed;top:52px;left:0;right:0;height:46px;
    background:var(--sel,#E7F1D8);z-index:77;border-bottom:1px solid rgba(0,0,0,.08);}
  body.m-detail .m-backbar{display:block;}
  body.m-detail .m-back{display:inline-flex;align-items:center;gap:6px;
    position:fixed;top:59px;left:10px;z-index:78;
    background:transparent;border:none;box-shadow:none;border-radius:8px;
    padding:6px 10px;font-family:inherit;font-size:13.5px;font-weight:600;
    color:#1A1D1A;cursor:pointer;-webkit-appearance:none;appearance:none;}

  /*  2) CONTENT NEVER STARTS ABOVE IT. This spacer is a pseudo-element, so
        innerHTML cannot remove it either, and being sticky it holds the top
        of the pane's own scroll box no matter how far the pane is scrolled.
        Top padding on the pane could not do this - padding only clears the
        bar while scrolled to the very top. Its height matches .m-backbar. */
  #greenCol.ag-detail::before{
    content:"";display:block;position:sticky;top:0;z-index:2;
    height:46px;margin:0 -14px 14px;background:var(--sel,#E7F1D8);
    border-bottom:1px solid rgba(0,0,0,.08);}

  /* ---- two-line rows ----
     .prow is a GRID on desktop, unlike every other list on the dashboards.
     Switching it to flex here turns its six children into flex items so the
     same wrap + order pattern used elsewhere applies, rather than inventing
     a grid-specific mechanism for one page.
     Standard row demanded 350px of fixed track, gaps and padding on a ~380px
     screen; the weights variant demanded 398px and overflowed outright. */
  .prow,.brow{display:flex !important;flex-wrap:wrap !important;align-items:center !important;
    grid-template-columns:none !important;
    row-gap:4px !important;column-gap:8px !important;
    padding-left:14px !important;padding-right:14px !important;
    padding-top:10px !important;padding-bottom:10px !important;}
  .prow::after,.brow::after{content:"";flex:0 0 100% !important;height:0;order:3;}

  /* Description leads; the bar and percent sit beside it. */
  .prow .psite{order:1;flex:1 1 auto !important;min-width:0;
    white-space:normal !important;overflow:visible !important;text-overflow:clip !important;
    overflow-wrap:anywhere;font-size:13.5px;line-height:1.3;}
  .prow .pid{order:4;flex:0 0 auto !important;font-size:11.5px;}
  .prow .pcad{order:5;flex:0 0 auto !important;font-size:11.5px;}
  .prow .pw{order:6;flex:0 0 auto !important;font-size:11.5px;}
  /* Two children are unnamed <span> wrappers - the bar+percent and the flag.
     They can only be reached by position, and the positions DIFFER between
     the variants because the weights row carries a leading .wmail button.
     Hence the two scoped rules rather than one shared one. */
  .prow:not(.wt) > span:nth-child(3){order:2;flex:0 0 auto !important;}
  .prow:not(.wt) > span:nth-child(6){order:7;flex:0 0 auto !important;margin-left:auto;}
  .prow.wt > .wmail{order:0;flex:0 0 auto !important;}
  .prow.wt > span:nth-child(4){order:2;flex:0 0 auto !important;}
  .prow.wt > span:nth-child(7){order:7;flex:0 0 auto !important;margin-left:auto;}

  /* Batch-weights rows crowd the same way (24px 50px 1fr 84px 66px).
     Only the first child is unnamed - it is either the checkbox or an empty
     span placeholder for ineligible boxes - so it is the one thing here
     addressed by position; the rest go by class. */
  .brow > *:first-child{order:0;flex:0 0 auto !important;}
  .brow .bsite{order:1;flex:1 1 auto !important;min-width:0;
    white-space:normal !important;overflow-wrap:anywhere;}
  .brow .bid{order:4;flex:0 0 auto !important;font-size:11.5px;}
  .brow .bchip{order:5;flex:0 0 auto !important;}
  .brow .bcov,.brow .bneed{order:6;flex:0 0 auto !important;font-size:11.5px;margin-left:auto;}

  .tier-btns{grid-template-columns:repeat(2,1fr) !important;}

  /* iOS zooms the viewport when a focused control computes under 16px. */
  input[type="text"], input[type="number"], input[type="password"],
  input[type="search"], input[type="email"], input:not([type]),
  textarea, select{font-size:16px !important;}
}
</style>
</head>
<body>
<aside class="wn-rail"><div class="wn-rail__brand"><img src="WastenetLogoSway.webp?v=2026-09-04" alt="WasteNet"><div class="wn-rail__menu" data-wn-nav data-label="Box Performance"></div></div><nav class="wn-rail__sections" id="tierRail"></nav></aside>

<div class="lock" id="lock">
  <div class="lock-card">
    <div class="lock-sub"><img class="wn-lock-logo" src="WastenetLogoSway.webp?v=2026-09-04" alt="WasteNet"></div>
    <input class="lock-in" id="lockIn" type="password" placeholder="Access key" autocomplete="off">
    <button class="lock-btn" id="lockBtn">Open</button>
    <div class="lock-err" id="lockErr" style="display:none;">That key is not right.</div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="ag-topbar">
    <div class="ag-hd ag-hd-list"><div class="ag-hd-title" id="grayTitle">Box performance</div><div class="ag-hd-sub" id="graySub"></div></div>
    <div class="ag-hd ag-hd-detail"><div class="ag-hd-title" id="greenTitle">Pull detail</div></div>
  </div>
  <div class="ag-split">
    <div class="ag-list-col" id="grayCol"><div class="empty-state"><span class="spinner"></span>Reading pull history&hellip;</div></div>
    <aside class="ag-detail" id="greenCol"><div class="rc-iv-card"><div class="pd-empty">Select a box to see its pull detail.</div></div></aside>
  </div>
</div>

<div class="cmp-overlay" id="cmpOverlay"><iframe id="cmpFrame" title="Weights request"></iframe></div>

<script src="logic.js?v=2026-07-17-perf"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwc3siwl0OTP2O5WzNZCDn4cj3MDVRfcVxJW0TZtoPnAKLwhYSwmW_m1h7ib6Yf_Dvk9w/exec";
var KEY = (function(){ try { return sessionStorage.getItem("wastenet_dashboard_key") || ""; } catch(e){ return ""; } })();

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function jsonp(params, cb){
  var name = "wn_cb_" + Math.random().toString(36).slice(2);
  var timeout = setTimeout(function(){ cleanup(); cb({ ok:false, error:"Request timed out." }); }, 30000);
  function cleanup(){
    clearTimeout(timeout);
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(s && s.parentNode) s.parentNode.removeChild(s);
  }
  window[name] = function(data){ cleanup(); cb(data); };
  var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
  var s = document.createElement("script");
  s.src = API + "?" + qs + "&callback=" + name;
  s.onerror = function(){ cleanup(); cb({ ok:false, error:"Could not reach the server." }); };
  document.body.appendChild(s);
}

/* The four tiers, best to worst. The battery drains left to right - full green
   on Maxed Out down to a red sliver on Empty Runs - so the fleet's health reads
   before a single word does. Order and thresholds live in the backend
   (getBoxPerformanceAsJson); this only labels and colours what it returns. */
var TIERS = [
  { key:"maxed",  name:"Maxed Out",   range:"85%+ full at pull", color:"#5CAA16", bat:95 },
  { key:"packed", name:"Well Packed", range:"70\u201384%",       color:"#639922", bat:76 },
  { key:"light",  name:"Light Loads", range:"55\u201369%",       color:"#EF9F27", bat:48 },
  { key:"empty",  name:"Empty Runs",  range:"under 55%",         color:"#E24B4A", bat:22 }
];

/* Weight coverage tiers, best to worst - green, gray, amber, red down the rail.
   These measure whether a box's recent pulls are being WEIGHED (share of its
   last 6 pulls), a separate question from how full it was. Counts + per-box
   wtTier / coverage / lastWeighed / pullsSinceWeight come from the same
   box_performance endpoint. */
var WEIGHT_TIERS = [
  { key:"fully",  name:"Fully Weighed",  range:"80%+ of last 6 pulls", color:"#5CAA16" },
  { key:"mostly", name:"Mostly Weighed", range:"50\u201379% of last 6",  color:"#888780" },
  { key:"rarely", name:"Rarely Weighed", range:"1\u201349% of last 6",   color:"#EF9F27" },
  { key:"never",  name:"Never Weighed",  range:"none in last 6",         color:"#E24B4A" }
];

/* Resolve a tier key to its metadata and which measure (rail section) it
   belongs to - 'full' (fullness) or 'wt' (weight). */
function tierInfo(key){
  for(var i=0;i<TIERS.length;i++){ if(TIERS[i].key===key) return { t:TIERS[i], mode:"full" }; }
  for(var j=0;j<WEIGHT_TIERS.length;j++){ if(WEIGHT_TIERS[j].key===key) return { t:WEIGHT_TIERS[j], mode:"wt" }; }
  return { t:TIERS[0], mode:"full" };
}

/* Default to Empty Runs - that's the work list, the boxes worth acting on. */
var state = { data: null, active: "empty", selected: null, batch: false, batchSel: {}, haulerSet: {} };

/* Normalize a box id the same way the monitor's master_contacts map is keyed
   (integer string), so "228", 228 and 228.0 all resolve to the same hauler
   lookup. Non-numeric ids fall through unchanged. */
function normId(x){ var n = parseInt(x, 10); return isNaN(n) ? String(x==null?"":x) : String(n); }

/* Returning from a weights handoff (or any deep link): restore the tier that
   was active and the box that was selected, so the user lands right where they
   left. Only a real tier key is honored; anything else falls back to default. */
(function(){
  try{
    var q=new URLSearchParams(location.search);
    var t=q.get("tier"), bx=q.get("box");
    if(t && tierInfo(t).t.key===t) state.active=t;
    if(bx){ state.selected=bx; state.scrollToSel=true; }
  }catch(e){}
})();

function battery(fill, color){
  var w = Math.max(2, Math.round(24 * Math.min(fill,100) / 100));
  return '<svg width="40" height="20" viewBox="0 0 40 20" aria-hidden="true">' +
    '<rect x="1" y="3" width="32" height="14" rx="3" fill="none" stroke="'+color+'" stroke-width="1.5"/>' +
    '<rect x="34" y="7" width="3" height="6" rx="1.5" fill="'+color+'"/>' +
    '<rect x="4" y="6" width="'+w+'" height="8" rx="1.5" fill="'+color+'"/></svg>';
}
function bar(pct, color){
  return '<span class="bar"><span style="width:'+Math.min(pct,100)+'%;background:'+color+';"></span></span>';
}
function flagHtml(f){
  if(f === "bridging")   return '<span class="flag flag-bridging">bridging</span>';
  if(f === "hauler-set") return '<span class="flag flag-hauler-set">hauler-set</span>';
  return "";
}

function renderRail(){
  var el=document.getElementById("tierRail"); if(!el) return;
  var d=state.data||{};
  function group(label, arr, counts, divider){
    return '<div class="rail-h'+(divider?" is-divider":"")+'">'+label+'</div>' + arr.map(function(t){
      var n=(counts&&counts[t.key])||0;
      var on=(t.key===state.active);
      return '<button class="sec'+(on?" on":"")+'" data-tier="'+t.key+'"><span class="sec-dot" style="background:'+t.color+'"></span>'+t.name+'<span class="n">'+n+'</span></button>';
    }).join("");
  }
  el.innerHTML = group("Fullness Performance", TIERS, d.tiers, false) +
                 group("Weight Performance", WEIGHT_TIERS, d.weightTiers, true);
  el.querySelectorAll("[data-tier]").forEach(function(btn){
    btn.onclick=function(){ state.active=btn.getAttribute("data-tier"); state.selected=null; state.batch=false; render(); };
  });
}

function render(){
  var d=state.data;
  if(!d || !d.ok){ var _g=document.getElementById("grayCol"); if(_g) _g.innerHTML='<div class="empty-state">Could not load performance data.</div>'; return; }
  if(state.batch){ renderRail(); renderBatch(); return; }
  var info=tierInfo(state.active);
  var active=info.t, mode=info.mode;
  renderRail();

  var counts = mode==="wt" ? (d.weightTiers||{}) : (d.tiers||{});
  var gt=document.getElementById("grayTitle"); if(gt) gt.textContent=active.name;
  var gs=document.getElementById("graySub"); if(gs) gs.textContent=active.range+' \u00b7 '+(counts[state.active]||0)+' boxes';

  var list=(d.boxes||[]).filter(function(b){ return (mode==="wt"?b.wtTier:b.tier)===state.active; });
  if(mode==="wt"){
    // Least-covered first, then most pulls since a weigh - the boxes most worth chasing float up.
    list.sort(function(a,b){ if(a.coverage!==b.coverage) return a.coverage-b.coverage; return (b.pullsSinceWeight||0)-(a.pullsSinceWeight||0); });
  } else {
    list.sort(function(a,b){ var af=a.flag?1:0,bf=b.flag?1:0; if(af!==bf) return af-bf; return a.avg-b.avg; });
  }

  var rowsHtml=list.map(function(b){
    var selCls=(String(state.selected)===String(b.id)?" sel":"");
    if(mode==="wt"){
      var lw=b.lastWeighed?esc(b.lastWeighed):"\u2014";
      var ps=(b.pullsSinceWeight==null)?"\u2014":b.pullsSinceWeight;
      return '<div class="prow wt'+selCls+'" data-id="'+esc(b.id)+'">' +
        '<button class="wmail" type="button" data-mail="'+esc(b.id)+'" title="Request weights from hauler" aria-label="Request weights"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.2 5.6l6.8 4.8 6.8-4.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>' +
        '<span class="pid">#'+esc(b.id)+'</span>' +
        '<span class="psite">'+esc(b.desc || ("Box "+b.id))+'</span>' +
        '<span>'+bar(b.coverage, active.color)+'<b class="pavg">'+b.coverage+'%</b></span>' +
        '<span class="pcad">'+lw+'</span>' +
        '<span class="pw">'+ps+'</span>' +
        '<span></span>' +
      '</div>';
    }
    return '<div class="prow'+selCls+'" data-id="'+esc(b.id)+'">' +
      '<span class="pid">#'+esc(b.id)+'</span>' +
      '<span class="psite">'+esc(b.desc || ("Box "+b.id))+'</span>' +
      '<span>'+bar(b.avg, active.color)+'<b class="pavg">'+b.avg+'%</b></span>' +
      '<span class="pcad">'+(b.cadence==null?"\u2014":(b.cadence+"d"))+'</span>' +
      '<span class="pw">\u2014</span>' +
      '<span>'+flagHtml(b.flag)+'</span>' +
    '</div>';
  }).join("");
  if(!rowsHtml) rowsHtml='<div class="tier-foot">No boxes in this tier.</div>';

  var extra=[];
  if(d.buildingCount)  extra.push(d.buildingCount + " box" + (d.buildingCount===1?"":"es") + " still building history (under 5 pulls)");
  if(d.noHistoryCount) extra.push(d.noHistoryCount + " with no pulls yet");

  var portfolio;
  if(mode==="wt"){
    var wt=d.weightTiers||{};
    var rated=(wt.fully||0)+(wt.mostly||0)+(wt.rarely||0)+(wt.never||0);
    var need=(wt.never||0)+(wt.rarely||0);
    portfolio=rated+' boxes rated \u00b7 '+need+' need collection \u00b7 coverage over the last 6 pulls';
  } else {
    portfolio=(d.boxes?d.boxes.length:0)+' boxes \u00b7 '+(d.totalPulls||0).toLocaleString()+' pulls \u00b7 avg '+d.portfolioAvg+'% full at pull';
  }

  // In any weight-coverage tier, offer the batch flow: pick across the whole
  // need-collection list at once and request weights hauler by hauler, instead
  // of one envelope per box.
  var batchBtn = (mode==="wt")
    ? '<button class="batch-start" id="batchStart" title="Request weights for many boxes at once, grouped by hauler">\u25A4 Batch weights request</button>'
    : "";

  var gray=document.getElementById("grayCol");
  if(gray) gray.innerHTML=
    batchBtn +
    '<div class="perf-portfolio">'+portfolio+'</div>' +
    '<div class="tier-list">'+rowsHtml+'</div>' +
    (extra.length ? '<div class="perf-meta">'+extra.join(" \u00b7 ")+'</div>' : "");

  var _bs=document.getElementById("batchStart");
  if(_bs) _bs.addEventListener("click", function(){ state.batch=true; state.selected=null; state.batchSel={}; render(); });

  document.querySelectorAll("#grayCol .prow").forEach(function(row){
    row.addEventListener("click", function(){ state.selected=row.getAttribute("data-id"); render(); });
  });
  // Envelope: open the box's Weights request in an overlay on THIS page - the
  // monitor's real compose, embedded in an iframe with its chrome hidden. The
  // performance list stays put behind it, so after send/close you're right
  // back on the same weight list, ready for the next envelope.
  document.querySelectorAll("#grayCol .wmail").forEach(function(btn){
    btn.addEventListener("click", function(ev){
      ev.stopPropagation();
      openWeightsCompose(btn.getAttribute("data-mail"));
    });
  });
  // Returning from a weights handoff: bring the selected row into view once.
  if(state.scrollToSel){
    var _sr=document.querySelector("#grayCol .prow.sel");
    if(_sr && _sr.scrollIntoView) _sr.scrollIntoView({block:"center"});
    state.scrollToSel=false;
  }
  renderDetail(d);
}

/* Compress the frozen tier buttons to their slim form once the sticky zone
   reaches the top. A 1px sentinel just above it flips the state exactly when it
   sticks - no scroll math, no jump. */
var slimWired = false;
function setupSlimObserver(){
  if(slimWired) return;
  var sentinel = document.getElementById("perfSentinel");
  var sticky = document.getElementById("perfSticky");
  if(!sentinel || !sticky || typeof IntersectionObserver === "undefined") return;
  slimWired = true;
  new IntersectionObserver(function(entries){
    sticky.classList.toggle("slim", !entries[0].isIntersecting);
  }, { threshold: 0 }).observe(sentinel);
}

function renderDetail(d){
  var pane=document.getElementById("greenCol"); if(!pane) return;
  var gt=document.getElementById("greenTitle");
  var boxes=(d.boxes||[]), b=null;
  for(var i=0;i<boxes.length;i++){ if(String(boxes[i].id)===String(state.selected)){ b=boxes[i]; break; } }
  if(!b){ if(gt) gt.textContent="Pull detail"; pane.innerHTML='<div class="rc-iv-card"><div class="pd-empty">Select a box to see its pull detail.</div></div>'; return; }
  if(gt) gt.textContent="#"+esc(b.id);

  // Recent pulls table (Date / Fill / Weight) - shared by both the weight and
  // fullness cards, newest first.
  var recent=(b.recent||[]);
  var histHtml='';
  if(recent.length){
    histHtml='<div class="pd-recent"><div class="pd-recent-h">Recent pulls \u00b7 last '+recent.length+'</div>' +
      '<div class="pd-hrow pd-hrow-h"><span class="hd">Date</span><span class="hp">Fill</span><span class="hw">Weight</span></div>' +
      recent.map(function(p){
        var has=p.w!==""&&p.w!=null;
        return '<div class="pd-hrow"><span class="hd">'+esc(p.d||"\u2014")+'</span>' +
          '<span class="hp">'+(p.p==null?"":p.p+"%")+'</span>' +
          '<span class="hw'+(has?"":" none")+'">'+(has?esc(p.w):"\u2014")+'</span></div>';
      }).join("") + '</div>';
  }

  // Weight mode: a coverage card (share of the last 6 pulls weighed) instead
  // of the fullness gauge. The selected box is always in the active tier, so
  // the active measure decides which card to draw.
  if(tierInfo(state.active).mode==="wt"){
    var wt=null; WEIGHT_TIERS.forEach(function(t){ if(t.key===b.wtTier) wt=t; });
    wt = wt || { name:"", color:"#8A8F8A", range:"" };
    var lw=b.lastWeighed?esc(b.lastWeighed):"\u2014";
    var ps=(b.pullsSinceWeight==null)?"\u2014":b.pullsSinceWeight;
    var status=(b.wtTier==="fully"||b.wtTier==="mostly")?"covered":"collect";
    var winsight;
    if(b.wtTier==="fully") winsight='<b>Well covered.</b> Recent pulls are being weighed \u2014 reliable weight data for this box.';
    else if(b.wtTier==="mostly") winsight='<b>Mostly there.</b> Weighed on most pulls; a few are slipping through.';
    else if(b.wtTier==="rarely") winsight='<b>Needs attention.</b> Only the odd pull is weighed \u2014 put this box on the collection list.';
    else winsight='<b>Go collect.</b> No weight in the last 6 pulls \u2014 start capturing weights here.';
    pane.innerHTML='<div class="rc-iv-card">' +
      '<div class="pd-head"><span class="pd-tag" style="background:'+wt.color+'1a;color:'+wt.color+'">'+esc(wt.name)+'</span>' +
        '<h3>#'+esc(b.id)+'</h3><div class="pd-sub">'+esc(b.desc||("Box "+b.id))+'</div></div>' +
      '<div class="pd-facts">' +
        '<div><div class="pd-fl">Coverage</div><div class="pd-fv" style="color:'+wt.color+'">'+b.coverage+'%</div></div>' +
        '<div><div class="pd-fl">Status</div><div class="pd-fv">'+status+'</div></div>' +
        '<div><div class="pd-fl">Last weighed</div><div class="pd-fv">'+lw+'</div></div>' +
        '<div><div class="pd-fl">Pulls since</div><div class="pd-fv">'+ps+'</div></div>' +
      '</div>' +
      '<div class="pd-insight">'+winsight+'</div>' +
      histHtml +
    '</div>';
    return;
  }

  var tier=null; TIERS.forEach(function(t){ if(t.key===b.tier) tier=t; });
  tier = tier || { name:"", color:"#8A8F8A", range:"" };
  var insight = (b.tier==="empty"||b.tier==="light")
    ? '<b>Worth a look.</b> This box is getting pulled before it fills. Stretching the schedule could save a haul without risking overflow.'
    : '<b>Dialed in.</b> Pulls are landing near full \u2014 the schedule is working.';
  pane.innerHTML='<div class="rc-iv-card">' +
    '<div class="pd-head"><span class="pd-tag" style="background:'+tier.color+'1a;color:'+tier.color+'">'+esc(tier.name)+'</span>' +
      '<h3>#'+esc(b.id)+'</h3><div class="pd-sub">'+esc(b.desc||("Box "+b.id))+'</div></div>' +
    '<div class="pd-facts">' +
      '<div><div class="pd-fl">Avg fill</div><div class="pd-fv" style="color:'+tier.color+'">'+b.avg+'%</div></div>' +
      '<div><div class="pd-fl">Status</div><div class="pd-fv">'+(b.flag?esc(b.flag):"actionable")+'</div></div>' +
      '<div><div class="pd-fl">Cadence</div><div class="pd-fv">'+(b.cadence==null?"\u2014":(b.cadence+" days"))+'</div></div>' +
      '<div><div class="pd-fl">Range</div><div class="pd-fv">'+esc(tier.range)+'</div></div>' +
    '</div>' +
    '<div class="pd-insight">'+insight+'</div>' +
    histHtml +
  '</div>';
}
function load(){
  var _lg=document.getElementById("grayCol"); if(_lg) _lg.innerHTML = '<div class="empty-state"><span class="spinner"></span>Reading pull history&hellip;</div>';
  jsonp({ action:"box_performance", key:KEY }, function(data){
    state.data = data;
    render();
  });
  fetchContacts();
}

/* The per-box hauler recipients (master_contacts, the same source the monitor
   and Contacts page read). Here we only need to know which boxes HAVE a hauler
   to email, so the batch surface can gate selection; the monitor resolves the
   actual addresses and Haul Code at send time. Non-fatal on failure - the set
   stays empty and every row reports "needs hauler" rather than guessing. */
function fetchContacts(){
  jsonp({ action:"master_contacts", key:KEY }, function(data){
    var raw = (data && data.contacts) || {};
    var set = {};
    Object.keys(raw).forEach(function(id){
      var c = raw[id] || {};
      if(String(c.toRecipients || "").trim()) set[normId(id)] = true;
    });
    state.haulerSet = set;
    if(state.batch) renderBatch();
  });
}

/* ---------- batch weights selection ---------- */
// The pool is the "need collection" list: every never- or rarely-weighed box,
// least-covered first. Fully/mostly-weighed boxes are deliberately left out -
// this surface exists to chase the boxes with no recent weights.
function needCollectionBoxes(){
  var d = state.data || {};
  return (d.boxes || [])
    .filter(function(b){ return b.wtTier === "never" || b.wtTier === "rarely"; })
    .sort(function(a,b){ if(a.coverage !== b.coverage) return a.coverage - b.coverage; return (b.pullsSinceWeight||0) - (a.pullsSinceWeight||0); });
}
// A box is selectable only if it has a hauler to email (To recipients on file).
// Boxes without one are the "needs hauler assigned first" list: shown, but not
// checkable.
function batchEligible(b){ return !!state.haulerSet[normId(b.id)]; }
// Checked by default for every eligible box; a box goes unchecked only once the
// user toggles it off. That keeps the default (and Select all) correct even if
// the contacts map arrives after the surface is first drawn.
function batchIsChecked(b){ return batchEligible(b) && state.batchSel[normId(b.id)] !== false; }
function batchSelectedIds(){ return needCollectionBoxes().filter(batchIsChecked).map(function(b){ return normId(b.id); }); }

function renderBatch(){
  var pool = needCollectionBoxes();
  var eligible = pool.filter(batchEligible);
  var noHauler = pool.length - eligible.length;
  var nSel = batchSelectedIds().length, nElig = eligible.length;
  var allOn = (nElig > 0 && nSel === nElig);

  var rows = pool.map(function(b){
    var elig = batchEligible(b);
    var cb = elig
      ? '<input type="checkbox" data-bid="'+esc(normId(b.id))+'"'+(batchIsChecked(b)?" checked":"")+'>'
      : '<span></span>';
    var tail = elig ? '<span class="bcov">'+b.coverage+'%</span>' : '<span class="bneed">needs hauler</span>';
    return '<div class="brow'+(elig?"":" dis")+'">' + cb +
      '<span class="bid">#'+esc(b.id)+'</span>' +
      '<span class="bsite">'+esc(b.desc || ("Box "+b.id))+'</span>' +
      '<span class="bchip '+esc(b.wtTier)+'">'+(b.wtTier==="never"?"never":"rarely")+'</span>' +
      tail +
    '</div>';
  }).join("");
  if(!rows) rows = '<div class="batch-foot">No boxes need collection right now.</div>';

  var bar =
    '<div class="batch-bar">' +
      '<label class="bsel"><input type="checkbox" id="batchAll"'+(allOn?" checked":"")+(nElig?"":" disabled")+'> Select all</label>' +
      '<span class="bcount"><b>'+nSel+'</b> of '+nElig+' selected</span>' +
      '<span class="bspacer"></span>' +
      '<button class="batch-btn ghost" id="batchExit">Exit</button>' +
      '<button class="batch-btn" id="batchCompose"'+(nSel?"":" disabled")+'>Compose batch ('+nSel+')</button>' +
    '</div>';

  var foot = noHauler
    ? '<div class="batch-foot">'+noHauler+' box'+(noHauler===1?"":"es")+' need a hauler assigned first \u2014 not selectable here.</div>'
    : "";

  var gray = document.getElementById("grayCol");
  if(gray) gray.innerHTML = bar + '<div class="tier-list">'+rows+'</div>' + foot;

  var pane = document.getElementById("greenCol");
  if(pane) pane.innerHTML = '<div class="rc-iv-card"><div class="pd-empty">' +
    'Pick the boxes to request weights for, then <b>Compose batch</b>. They\u2019ll be grouped by Haul Code \u2014 one email per hauler, listing that hauler\u2019s boxes.</div></div>';
  var gt = document.getElementById("greenTitle"); if(gt) gt.textContent = "Batch weights";
  var gtl = document.getElementById("grayTitle"); if(gtl) gtl.textContent = "Batch weights request";
  var gsu = document.getElementById("graySub"); if(gsu) gsu.textContent = nElig + " boxes with a hauler on file";

  var all = document.getElementById("batchAll");
  if(all) all.addEventListener("change", function(){
    var on = this.checked;
    eligible.forEach(function(b){ state.batchSel[normId(b.id)] = on; });
    renderBatch();
  });
  var exit = document.getElementById("batchExit");
  if(exit) exit.addEventListener("click", function(){ state.batch=false; render(); });
  var comp = document.getElementById("batchCompose");
  if(comp) comp.addEventListener("click", function(){ var ids = batchSelectedIds(); if(ids.length) openWeightsBatch(ids); });
  if(gray) gray.querySelectorAll(".brow input[type=checkbox]").forEach(function(cb){
    cb.addEventListener("change", function(){ state.batchSel[cb.getAttribute("data-bid")] = cb.checked; renderBatch(); });
  });
}

/* Hand the chosen boxes to the monitor's compose in batch mode - the same
   embedded overlay the single-box envelope uses, told to group by Haul Code
   and draft one Weights email per hauler. */
function openWeightsBatch(ids){
  var frame=document.getElementById("cmpFrame"), ov=document.getElementById("cmpOverlay");
  if(!frame || !ov) return;
  frame.src="wastenet-monitor.html?embed=1&batch=1&boxes="+encodeURIComponent(ids.join(","));
  ov.classList.add("show");
  document.body.style.overflow="hidden";
}

/* ---------- weights compose overlay ---------- */
function openWeightsCompose(id){
  var frame=document.getElementById("cmpFrame"), ov=document.getElementById("cmpOverlay");
  if(!frame || !ov) return;
  var desc="", boxes=(state.data&&state.data.boxes)||[];
  for(var i=0;i<boxes.length;i++){ if(String(boxes[i].id)===String(id)){ desc=boxes[i].desc||""; break; } }
  frame.src="wastenet-monitor.html?embed=1&box="+encodeURIComponent(id)+"&draft=Weights&desc="+encodeURIComponent(desc);
  ov.classList.add("show");
  document.body.style.overflow="hidden";
}
function closeWeightsCompose(){
  var frame=document.getElementById("cmpFrame"), ov=document.getElementById("cmpOverlay");
  if(ov) ov.classList.remove("show");
  if(frame) frame.src="about:blank";
  document.body.style.overflow="";
}
(function(){
  // The embedded compose posts this when Send-then-close or Cancel happens.
  window.addEventListener("message", function(e){
    if(e.origin!==location.origin) return;
    if(e.data && e.data.type==="wn-compose-close") closeWeightsCompose();
  });
  var ov=document.getElementById("cmpOverlay");
  if(ov) ov.addEventListener("click", function(e){ if(e.target===ov) closeWeightsCompose(); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ var o=document.getElementById("cmpOverlay"); if(o && o.classList.contains("show")) closeWeightsCompose(); }
  });
})();

/* ---------- lock ---------- */
(function(){
  var lock = document.getElementById("lock"), lockIn = document.getElementById("lockIn"), lockBtn = document.getElementById("lockBtn");
  function unlock(){
    var v = (lockIn.value || "").trim();
    if(!v) return;
    try { sessionStorage.setItem("wastenet_dashboard_key", v); } catch(e){}
    KEY = v;
    lock.style.display = "none";
    document.getElementById("app").style.display = "";
    document.getElementById("lockErr").style.display = "none";
    load();
  }
  lockBtn.onclick = unlock;
  lockIn.onkeydown = function(e){ if(e.key === "Enter") unlock(); };
  if(KEY){
    lock.style.display = "none";
    document.getElementById("app").style.display = "";
    load();
  }
})();
</script>
<script id="m-pf-js">
/* ===== mobile layer (<=860px) =====
   Injects the fixed topbar, the drawer backdrop and the "Back to list"
   button, then toggles .m-open on the rail and .m-detail on the body. All
   positioning lives in m-pf-css behind the media query. */
(function(){
  var rail = document.querySelector('.wn-rail');
  if(!rail) return;

  var tb = document.createElement('div');
  tb.className = 'm-topbar';
  tb.innerHTML = '<button class="m-burger" id="mBurger" aria-label="Menu">\u2630</button>' +
                 '<span class="m-title">WasteNet Box Performance</span>';
  var bd = document.createElement('div'); bd.className = 'm-backdrop'; bd.id = 'mBackdrop';
  var bk = document.createElement('button'); bk.className = 'm-back'; bk.id = 'mBack';
  bk.type = 'button';
  bk.innerHTML = '\u2039 Back to list';
  /* Back bar and its button both live at BODY level. Nothing the page
     renders into the detail pane can remove them, which is the failure mode
     that left the panel with no way out. The pane keeps content clear of
     them with a sticky ::before spacer - see m-pf-css. */
  var bbar = document.createElement('div'); bbar.className = 'm-backbar'; bbar.id = 'mBackBar';
  document.body.appendChild(tb);
  document.body.appendChild(bd);
  document.body.appendChild(bbar);
  document.body.appendChild(bk);

  var pane = document.getElementById('greenCol');

  function openRail(){ rail.classList.add('m-open'); bd.classList.add('m-open'); }
  function closeRail(){ rail.classList.remove('m-open'); bd.classList.remove('m-open'); }

  document.getElementById('mBurger').addEventListener('click', openRail);
  bd.addEventListener('click', closeRail);

  // Switching tier closes the drawer and drops any open box - the new tier's
  // list is what you should land on, not the previous selection.
  rail.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.wn-rail__sections .sec, .wn-tri, .wn-item')){
      document.body.classList.remove('m-detail');
      setTimeout(closeRail, 80);
    }
  });

  /* Selection is read from the pane's own content: the renderer writes
     .pd-empty ("Select a box to see its pull detail") when nothing is
     chosen, so its absence is the reliable signal and it survives the list
     being redrawn underneath. */
  function syncDetail(){
    if(pane && !pane.querySelector('.pd-empty')){
      document.body.classList.add('m-detail');
      /* Start every box at the top of its card. The pane keeps its scroll
         offset across renders, so opening a box after scrolling through a
         long pull history would otherwise land you mid-card with the status
         pill hidden behind the Back bar. */
      pane.scrollTop = 0;
    } else {
      document.body.classList.remove('m-detail');
    }
  }

  /* Only a tap on a row opens the panel. Tier buttons and the batch surface
     are navigation and can only close it, so arriving at the page - or
     switching tiers - leaves you on the list.
     .wmail is excluded: it opens the weights-request handoff, not the
     detail pane, and swallowing it here would hide that flow behind a
     panel the user did not ask for. */
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    if(e.target.closest('.wmail')) return;
    if(e.target.closest('.prow')) setTimeout(syncDetail, 60);
    else if(e.target.closest('.tier-btns, .sec, .batch-bar')) document.body.classList.remove('m-detail');
  });

  bk.addEventListener('click', function(){ document.body.classList.remove('m-detail'); });
})();
</script>
